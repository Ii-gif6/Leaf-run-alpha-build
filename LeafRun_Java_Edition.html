        function drawSmileyLoad() {
            // Leaf jumping loading screen — shown when player hits Start on title
            const progress = Math.min(1, smileyLoadTimer / SMILEY_LOAD_DURATION);
            const sceneT = smileyLoadTimer;

            // Sky + ground
            ctx.fillStyle = '#87ceeb';
            ctx.fillRect(0, 0, canvas.width, groundY);
            ctx.fillStyle = 'rgba(255,255,255,0.35)';
            for (let i = 0; i < 4; i++) {
                const cx = ((i * 140 + sceneT * 0.4) % (canvas.width + 80)) - 40;
                const cy = 30 + (i % 3) * 28;
                ctx.beginPath();
                ctx.ellipse(cx, cy, 36, 14, 0, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.fillStyle = '#5d9c3f';
            ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
            ctx.fillStyle = 'rgba(0,0,0,0.08)';
            for (let x = -((sceneT * 2.2) % 40); x < canvas.width; x += 40) {
                ctx.fillRect(x, groundY, 20, canvas.height - groundY);
            }

            // Scrolling spikes
            const spikeSpeed = 2.4;
            const spikeGap = 110;
            const spikeScroll = (sceneT * spikeSpeed) % spikeGap;
            const spikeSprite = artMatrices.spike;
            const spikePs = 2.0;
            for (let i = -1; i < 6; i++) {
                const sx = canvas.width + 20 - spikeScroll - i * spikeGap;
                if (sx < -40 || sx > canvas.width + 40) continue;
                drawMatrix(spikeSprite, sx, groundY - spikeSprite.length * spikePs, spikePs, '#5d1a1a');
            }

            // Leaf jump loop
            const jumpCycle = 50;
            const phase = sceneT % jumpCycle;
            const jumpH = 52;
            let leafYOff = 0;
            if (phase < 28) {
                const u = phase / 28;
                leafYOff = -Math.sin(u * Math.PI) * jumpH;
            }
            const leafX = 100;
            const leafPs = 2.6;
            const leafSprite = artMatrices.leaf;
            const leafH = leafSprite.length * leafPs;
            const leafY = groundY - leafH + leafYOff;
            ctx.fillStyle = 'rgba(0,0,0,0.18)';
            ctx.beginPath();
            ctx.ellipse(leafX + leafSprite[0].length * leafPs * 0.5, groundY - 2, 14 - leafYOff * 0.08, 4, 0, 0, Math.PI * 2);
            ctx.fill();
            drawMatrix(leafSprite, leafX, leafY, leafPs, '#2e7d32');

            // Title
            ctx.textAlign = 'center';
            ctx.fillStyle = 'rgba(0,0,0,0.25)';
            ctx.font = 'bold 26px monospace';
            ctx.fillText('LeafRun', canvas.width / 2 + 2, 36);
            ctx.fillStyle = '#1b5e20';
            ctx.fillText('LeafRun', canvas.width / 2, 34);

            // Rotating hints
            const hints = [
                t('loadHint1'),
                t('loadHint2'),
                t('loadHint3'),
                t('loadHint4'),
                t('loadHint5')
            ];
            const hintIdx = Math.floor(sceneT / 55) % hints.length;
            const local = sceneT % 55;
            let hintFade = 1;
            if (local < 8) hintFade = local / 8;
            else if (local > 45) hintFade = (55 - local) / 10;
            ctx.save();
            ctx.globalAlpha = Math.max(0, hintFade);
            const hint = hints[hintIdx] || '';
            ctx.font = '13px monospace';
            const hw = Math.min(360, ctx.measureText(hint).width + 28);
            const hx = (canvas.width - hw) / 2;
            const hy = 48;
            ctx.fillStyle = 'rgba(255,255,255,0.88)';
            ctx.fillRect(hx, hy, hw, 28);
            ctx.strokeStyle = 'rgba(46,125,50,0.55)';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(hx, hy, hw, 28);
            ctx.fillStyle = '#1b5e20';
            ctx.fillText(hint, canvas.width / 2, hy + 19);
            ctx.restore();

            // Progress bar
            const barW = 200;
            const barX = (canvas.width - barW) / 2;
            const barY = 292;
            ctx.fillStyle = 'rgba(0,0,0,0.35)';
            ctx.fillRect(barX - 2, barY - 2, barW + 4, 12);
            ctx.fillStyle = '#1b5e20';
            ctx.fillRect(barX, barY, barW, 8);
            ctx.fillStyle = '#81c784';
            ctx.fillRect(barX, barY, barW * progress, 8);
            ctx.fillStyle = 'rgba(255,255,255,0.25)';
            ctx.fillRect(barX, barY, barW * progress, 3);

            ctx.textAlign = 'center';
            ctx.fillStyle = '#e8f5e9';
            ctx.font = '11px monospace';
            ctx.fillText(t('loading') + ' ' + Math.floor(progress * 100) + '%', canvas.width / 2, barY + 22);
        }

        function drawLoading() {
            // Boot: Unity logo, then Smiley Tech
            const unityEnd = Math.floor(LOADING_DURATION * 0.45);
            const progress = Math.min(1, loadingTimer / LOADING_DURATION);

            if (loadingTimer < unityEnd) {
                ctx.fillStyle = '#0a0a0a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                const t = loadingTimer / Math.max(1, unityEnd);
                const ease = 1 - Math.pow(1 - t, 1.6);
                const baseW = 200;
                const baseH = 68;
                const scale = 0.48 + ease * 0.52;
                const unityW = baseW * scale;
                const unityH = baseH * scale;
                const ux = (canvas.width - unityW) / 2;
                const uy = (canvas.height - unityH) / 2 - 10;
                const alpha = Math.min(1, t * 2.5);
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.textAlign = 'center';
                ctx.fillStyle = '#aaa';
                ctx.font = '14px monospace';
                ctx.fillText('Made with', canvas.width / 2, uy - 18);
                if (unityLogoLoaded && unityLogoImg.complete) {
                    ctx.imageSmoothingEnabled = true;
                    ctx.drawImage(unityLogoImg, ux, uy, unityW, unityH);
                } else {
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 22px sans-serif';
                    ctx.fillText('Unity', canvas.width / 2, uy + unityH / 2 + 8);
                }
                ctx.restore();
                return;
            }

            // Smiley Tech
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const phaseT = loadingTimer - unityEnd;
            const fadeIn = Math.min(1, phaseT / 15);

            ctx.save();
            ctx.globalAlpha = fadeIn;

            const logoSize = 96;
            const lx = (canvas.width - logoSize) / 2;
            const ly = 70;
            if (logoLoaded && logoImg.complete) {
                ctx.imageSmoothingEnabled = false;
                ctx.drawImage(logoImg, lx, ly, logoSize, logoSize);
            } else {
                ctx.fillStyle = '#222';
                ctx.fillRect(lx, ly, logoSize, logoSize);
                ctx.fillStyle = '#4caf50';
                ctx.font = 'bold 40px monospace';
                ctx.textAlign = 'center';
                ctx.fillText(':)', canvas.width / 2, ly + 58);
            }

            ctx.textAlign = 'center';
            ctx.fillStyle = '#e8e8e8';
            ctx.font = 'bold 22px monospace';
            ctx.fillText('Smiley Tech', canvas.width / 2, ly + logoSize + 36);

            const barW = 160;
            const barX = (canvas.width - barW) / 2;
            const barY = ly + logoSize + 58;
            ctx.fillStyle = '#333';
            ctx.fillRect(barX, barY, barW, 6);
            ctx.fillStyle = '#4caf50';
            ctx.fillRect(barX, barY, barW * progress, 6);

            ctx.font = '11px monospace';
            ctx.fillStyle = '#888';
            ctx.fillText(t('loading'), canvas.width / 2, barY + 22);

            ctx.restore();
        }

        function drawJumpscare() {
            // Full black flash background
            ctx.fillStyle = '#000';
            ctx.fillRect(-20, -20, canvas.width + 40, canvas.height + 40);

            // Scale image to dominate the screen (cover most of 480x320)
            const imgW = scareImg.naturalWidth || 498;
            const imgH = scareImg.naturalHeight || 490;
            // Fit height-wise with slight zoom for impact
            const scale = Math.max(canvas.width / imgW, canvas.height / imgH) * 1.15;
            const dw = imgW * scale;
            const dh = imgH * scale;
            const dx = (canvas.width - dw) / 2;
            const dy = (canvas.height - dh) / 2 - 10;

            if (scareLoaded && scareImg.complete) {
                ctx.imageSmoothingEnabled = false;
                // Red tint flash early in scare
                const t = 1 - (jumpscareTimer / JUMPSCARE_DURATION);
                if (t < 0.15) {
                    ctx.fillStyle = '#4a0000';
                    ctx.fillRect(-20, -20, canvas.width + 40, canvas.height + 40);
                }
                ctx.drawImage(scareImg, dx, dy, dw, dh);

                // Animated pupils moving back and forth over the eyes
                const eyeOffset = Math.sin(jumpscareEyePhase) * (dw * 0.022);
                const pupilR = Math.max(4, dw * SCARE_PUPIL_R);
                const lx = dx + SCARE_EYE_L.x * dw + eyeOffset;
                const ly = dy + SCARE_EYE_L.y * dh;
                const rx = dx + SCARE_EYE_R.x * dw + eyeOffset;
                const ry = dy + SCARE_EYE_R.y * dh;

                // White sclera reinforcement (in case image is dark)
                ctx.fillStyle = '#e8e8e8';
                ctx.beginPath();
                ctx.ellipse(lx, ly, pupilR * 1.8, pupilR * 1.5, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(rx, ry, pupilR * 1.8, pupilR * 1.5, 0, 0, Math.PI * 2);
                ctx.fill();

                // Black pupils
                ctx.fillStyle = '#0a0a0a';
                ctx.beginPath();
                ctx.arc(lx, ly, pupilR, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(rx, ry, pupilR, 0, Math.PI * 2);
                ctx.fill();

                // Tiny specular highlight that also tracks
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(lx - pupilR * 0.3, ly - pupilR * 0.3, pupilR * 0.25, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(rx - pupilR * 0.3, ry - pupilR * 0.3, pupilR * 0.25, 0, Math.PI * 2);
                ctx.fill();
            } else {
                // Fallback silhouette if image not ready
                ctx.fillStyle = '#111';
                ctx.fillRect(dx + dw * 0.2, dy + dh * 0.1, dw * 0.6, dh * 0.8);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 28px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('...', canvas.width / 2, canvas.height / 2);
            }

            // Heavy vignette + red edges
            const vig = ctx.createRadialGradient(
                canvas.width / 2, canvas.height / 2, canvas.width * 0.15,
                canvas.width / 2, canvas.height / 2, canvas.width * 0.75
            );
            vig.addColorStop(0, 'rgba(0,0,0,0)');
            vig.addColorStop(0.7, 'rgba(40,0,0,0.35)');
            vig.addColorStop(1, 'rgba(0,0,0,0.85)');
            ctx.fillStyle = vig;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Scanline / static noise for extra jolt
            const noiseAmt = 0.45 + Math.random() * 0.25;
            for (let i = 0; i < 50; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                ctx.fillStyle = Math.random() > 0.5
                    ? `rgba(255,40,40,${Math.random() * 0.35})`
                    : `rgba(0,0,0,${Math.random() * 0.4})`;
                ctx.fillRect(x, y, 2 + Math.random() * 3, 1 + Math.random() * 2);
            }
        }

        function drawGirlfriendKill() {
            // Dark crimson background
            ctx.fillStyle = '#0a0000';
            ctx.fillRect(-20, -20, canvas.width + 40, canvas.height + 40);

            const elapsed = GIRLFRIEND_DURATION - girlfriendTimer;
            const t = elapsed / GIRLFRIEND_DURATION;

            // Soft red vignette
            const vig = ctx.createRadialGradient(
                canvas.width / 2, canvas.height / 2, 30,
                canvas.width / 2, canvas.height / 2, 280
            );
            vig.addColorStop(0, 'rgba(60,0,0,0.2)');
            vig.addColorStop(1, 'rgba(0,0,0,0.75)');
            ctx.fillStyle = vig;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Monster (scareImg) on the left side
            const mScale = 0.55;
            const imgW = scareImg.naturalWidth || 498;
            const imgH = scareImg.naturalHeight || 490;
            const mw = imgW * mScale * 0.45;
            const mh = imgH * mScale * 0.45;
            let mx = 40;
            let my = groundY - mh + 10;
            // During approach/kill, monster leans toward girlfriend
            if (elapsed >= 70 && elapsed < 180) {
                const lean = Math.min(1, (elapsed - 70) / 60);
                mx += lean * 55;
            }

            if (scareLoaded && scareImg.complete) {
                ctx.imageSmoothingEnabled = false;
                ctx.drawImage(scareImg, mx, my, mw, mh);
                // Moving eyes
                const eyeOff = Math.sin(girlfriendEyePhase) * (mw * 0.03);
                const pr = Math.max(3, mw * SCARE_PUPIL_R);
                const lx = mx + SCARE_EYE_L.x * mw + eyeOff;
                const ly = my + SCARE_EYE_L.y * mh;
                const rx = mx + SCARE_EYE_R.x * mw + eyeOff;
                const ry = my + SCARE_EYE_R.y * mh;
                ctx.fillStyle = '#e8e8e8';
                ctx.beginPath();
                ctx.ellipse(lx, ly, pr * 1.7, pr * 1.4, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(rx, ry, pr * 1.7, pr * 1.4, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#0a0a0a';
                ctx.beginPath();
                ctx.arc(lx, ly, pr, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(rx, ry, pr, 0, Math.PI * 2);
                ctx.fill();
            }

            // Girlfriend: leaf-shaped character (same matrix as player) in rose/pink
            const gfPixel = 3.2;
            const gfW = artMatrices.leaf[0].length * gfPixel;
            const gfH = artMatrices.leaf.length * gfPixel;
            let gfx = 280;
            let gfy = groundY - gfH;
            let gfColor = '#e91e63'; // pink / rose like a "girlfriend" leaf
            let gfAlpha = 1;

            if (elapsed >= 130) {
                // Kill phase: darken, drop, blood color
                const killT = Math.min(1, (elapsed - 130) / 50);
                gfColor = killT < 0.4 ? '#c62828' : '#4a0000';
                gfy += killT * 18; // collapses downward
                gfAlpha = 1 - killT * 0.55;
                if (killT > 0.6) {
                    // slight sideways tilt simulation via offset
                    gfx += (killT - 0.6) * 12;
                }
            }

            ctx.save();
            ctx.globalAlpha = gfAlpha;
            drawMatrix(artMatrices.leaf, gfx, gfy, gfPixel, gfColor);
            // Small heart accent above her head while alive
            if (elapsed < 130) {
                ctx.fillStyle = '#ff80ab';
                ctx.font = '14px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('♥', gfx + gfW / 2, gfy - 6);
            }
            ctx.restore();

            // Blood particles
            girlfriendBlood.forEach(b => {
                const a = Math.max(0, b.life / 50);
                ctx.fillStyle = `rgba(180,0,20,${a})`;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                ctx.fill();
            });

            // Text captions by phase
            ctx.textAlign = 'center';
            ctx.save();
            if (elapsed < 70) {
                ctx.globalAlpha = Math.min(1, elapsed / 20);
                ctx.fillStyle = '#e8c8c8';
                ctx.font = '14px monospace';
                ctx.fillText('He came back...', canvas.width / 2, 40);
                ctx.font = '12px monospace';
                ctx.fillStyle = '#c0a0a0';
                ctx.fillText('and he brought her with him.', canvas.width / 2, 60);
            } else if (elapsed < 130) {
                ctx.globalAlpha = 0.9;
                ctx.fillStyle = '#ffcccc';
                ctx.font = '13px monospace';
                ctx.fillText('She looks just like you.', canvas.width / 2, 42);
            } else if (elapsed < 200) {
                ctx.globalAlpha = Math.min(1, (elapsed - 130) / 15);
                ctx.fillStyle = '#ff2222';
                ctx.font = 'bold 18px monospace';
                ctx.fillText('He killed her.', canvas.width / 2, 48);
                if (elapsed > 160) {
                    ctx.font = '12px monospace';
                    ctx.fillStyle = '#ffaaaa';
                    ctx.fillText('You\'re next.', canvas.width / 2, 72);
                }
            } else {
                ctx.globalAlpha = Math.max(0, 1 - (elapsed - 200) / 50);
                ctx.fillStyle = '#888';
                ctx.font = '12px monospace';
                ctx.fillText('...', canvas.width / 2, 50);
            }
            ctx.restore();

            // Extra static during kill
            if (elapsed >= 130 && elapsed < 190) {
                for (let i = 0; i < 30; i++) {
                    const x = Math.random() * canvas.width;
                    const y = Math.random() * canvas.height;
                    ctx.fillStyle = Math.random() > 0.5
                        ? `rgba(255,30,30,${Math.random() * 0.4})`
                        : `rgba(0,0,0,${Math.random() * 0.35})`;
                    ctx.fillRect(x, y, 2, 2);
                }
            }
        }


        function drawEndingParty() {
            ctx.fillStyle = '#87ceeb';
            ctx.fillRect(0, 0, canvas.width, groundY);
            ctx.fillStyle = '#5d9c3f';
            ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
            // Simple party: player + friend leaves
            if (typeof partyFriends !== 'undefined' && partyFriends) {
                partyFriends.forEach(f => {
                    const bob = Math.sin(f.bob || 0) * 3;
                    drawMatrix(artMatrices.leaf, f.x, groundY - 28 + bob, 2.5, f.color || '#4caf50');
                });
            }
            drawMatrix(artMatrices.leaf, player.x, player.y, player.width / artMatrices.leaf[0].length, '#2e7d32');
            ctx.textAlign = 'center';
            ctx.fillStyle = '#1b5e20';
            ctx.font = 'bold 16px monospace';
            ctx.fillText('You made it home.', canvas.width / 2, 40);
            ctx.font = '12px monospace';
            ctx.fillStyle = '#333';
            ctx.fillText('The leaves are waiting.', canvas.width / 2, 60);
        }

        function drawEndingCutscene() {
            ctx.fillStyle = '#0a0a12';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            const t = endingTimer / ENDING_CUTSCENE_DURATION;
            ctx.globalAlpha = Math.min(1, t * 2);
            ctx.textAlign = 'center';
            ctx.fillStyle = '#e0e0e0';
            ctx.font = '14px monospace';
            ctx.fillText('For a moment, everything was quiet.', canvas.width / 2, 140);
            ctx.globalAlpha = Math.max(0, Math.min(1, (t - 0.4) * 2));
            ctx.fillStyle = '#aaa';
            ctx.font = '12px monospace';
            ctx.fillText('Then the chunks started to shift…', canvas.width / 2, 170);
            ctx.globalAlpha = 1;
        }

        function drawEndingDone() {
            ctx.fillStyle = '#0d1a0d';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.textAlign = 'center';
            ctx.fillStyle = '#a5d6a7';
            ctx.font = 'bold 22px monospace';
            ctx.fillText('THE END', canvas.width / 2, 80);
            ctx.fillStyle = '#c8e6c9';
            ctx.font = '13px monospace';
            ctx.fillText('You survived LeafRun.', canvas.width / 2, 115);

            // Messed Up Chunks badge reveal
            ctx.fillStyle = 'rgba(90, 40, 120, 0.95)';
            ctx.fillRect(canvas.width / 2 - 110, 140, 220, 50);
            ctx.strokeStyle = '#ce93d8';
            ctx.lineWidth = 2;
            ctx.strokeRect(canvas.width / 2 - 110, 140, 220, 50);
            ctx.fillStyle = '#f3e5f5';
            ctx.font = 'bold 14px monospace';
            ctx.fillText('🧩 MESSED UP CHUNKS', canvas.width / 2, 162);
            ctx.font = '11px monospace';
            ctx.fillStyle = '#e1bee7';
            ctx.fillText('Badge unlocked — you beat the game', canvas.width / 2, 180);

            ctx.fillStyle = '#888';
            ctx.font = '12px monospace';
            ctx.fillText('Tap / Space — Menu', canvas.width / 2, 240);
            ctx.fillStyle = '#666';
            ctx.font = '11px monospace';
            ctx.fillText('Wins: ' + (stats.wins || 0), canvas.width / 2, 270);
        }

        function draw() {
            ctx.save();
            if (screenShake > 0 && !isPaused && !a11yReduceMotion && !parentMode) {
                ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
            }

            ctx.clearRect(-10, -10, canvas.width + 20, canvas.height + 20);

            if (gameState === 'LOADING') {
                drawLoading();
                ctx.restore();
                return;
            }

            if (gameState === 'WARNING') {
                drawWarning();
                ctx.restore();
                return;
            }

            if (gameState === 'SMILEY_LOAD') {
                drawSmileyLoad();
                ctx.restore();
                return;
            }

            if (gameState === 'TUTORIAL') {
                drawTutorial();
                ctx.restore();
                return;
            }

            if (gameState === 'GAMEOVER') {
                drawDeathScreen();
                // Achievement toast can still show on death
                if (achievementToast) {
                    const a = ACHIEVEMENTS.find(x => x.id === achievementToast.id);
                    if (a) {
                        const alpha = Math.min(1, achievementToast.life / 30, (180 - achievementToast.life) / 20);
                        ctx.save();
                        ctx.globalAlpha = Math.max(0, alpha);
                        ctx.fillStyle = 'rgba(20,40,20,0.92)';
                        ctx.fillRect(80, 8, 320, 42);
                        ctx.strokeStyle = '#4caf50';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(80, 8, 320, 42);
                        ctx.textAlign = 'left';
                        ctx.font = '16px monospace';
                        ctx.fillStyle = '#fff';
                        ctx.fillText(a.icon + ' ' + a.name, 92, 26);
                        ctx.font = '10px monospace';
                        ctx.fillStyle = '#a5d6a7';
                        ctx.fillText(a.desc, 92, 42);
                        ctx.restore();
                    }
                }
                ctx.restore();
                return;
            }

            if (gameState === 'BLACKOUT') {
                ctx.fillStyle = '#000';
                ctx.fillRect(-10, -10, canvas.width + 20, canvas.height + 20);
                ctx.restore();
                return;
            }

            if (gameState === 'JUMPSCARE') {
                drawJumpscare();
                ctx.restore();
                return;
            }

            if (gameState === 'GIRLFRIEND_KILL') {
                drawGirlfriendKill();
                ctx.restore();
                return;
            }

            if (gameState === 'ENDING_PARTY') {
                drawEndingParty();
                ctx.restore();
                return;
            }

            if (gameState === 'ENDING_CUTSCENE') {
                drawEndingCutscene();
                ctx.restore();
                return;
            }

            if (gameState === 'ENDING_DONE') {
                drawEndingDone();
                ctx.restore();
                return;
            }

            const dreadAmount = Math.max(0, Math.min(1, (level - 10) / 20));
            const postCorrupt = gameState === 'PLAYING_CORRUPT';
            const falseCalm = postCorrupt && level >= FALSE_CALM_LEVEL && level < WORSE_LEVEL;
            const isWorse = postCorrupt && level >= WORSE_LEVEL;
            const redHorror = postCorrupt && level < FALSE_CALM_LEVEL;

            // Background
            const inCity = (gameState === 'PLAYING' || gameState === 'PLAYING_CORRUPT') && level >= CITY_LEVEL && !glitchWorldMode;
            if (gameState === 'START' || gameState === 'SETTINGS' || gameState === 'ACHIEVEMENTS' || gameState === 'LEADERBOARD') {
                // Minecraft Java-style dirt panorama menu background
                ctx.fillStyle = '#7a6a4f';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                // Darker dirt tiles
                for (let y = 0; y < canvas.height; y += 16) {
                    for (let x = 0; x < canvas.width; x += 16) {
                        const n = ((x * 13 + y * 7) % 5);
                        ctx.fillStyle = n === 0 ? '#6b5b40' : (n === 1 ? '#8a7a5c' : '#756548');
                        ctx.fillRect(x, y, 16, 16);
                    }
                }
                // Soft vignette
                const vg = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 40, canvas.width/2, canvas.height/2, 280);
                vg.addColorStop(0, 'rgba(0,0,0,0)');
                vg.addColorStop(1, 'rgba(0,0,0,0.45)');
                ctx.fillStyle = vg;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            } else if (glitchWorldMode && (gameState === 'PLAYING' || gameState === 'PLAYING_CORRUPT')) {
                // The Glitch World: magenta sky + pink ground + cyan grid stripes
                ctx.fillStyle = skyColor(0);
                ctx.fillRect(0, 0, canvas.width, groundY);
                // Subtle cyan stars / glitch dots
                ctx.fillStyle = 'rgba(0,191,255,0.35)';
                for (let i = 0; i < 22; i++) {
                    const sx = ((i * 53 + Math.floor(bgScroll * 0.15)) % canvas.width);
                    const sy = 6 + (i * 19) % (groundY - 30);
                    ctx.fillRect(sx, sy, 2, 2);
                }
                ctx.fillStyle = groundColor(0);
                ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
                // Blue outline stripes on ground
                ctx.fillStyle = 'rgba(0,191,255,0.45)';
                for (let x = (bgScroll * 0.9) % 36; x < canvas.width; x += 36) {
                    ctx.fillRect(x, groundY, 3, canvas.height - groundY);
                }
                // Top edge blue line
                ctx.fillStyle = '#00bfff';
                ctx.fillRect(0, groundY - 2, canvas.width, 3);
            } else if (inCity) {
                // Dark city night
                ctx.fillStyle = skyColor(0);
                ctx.fillRect(0, 0, canvas.width, groundY);
                // Subtle star/light dust
                ctx.fillStyle = 'rgba(200,200,220,0.35)';
                for (let i = 0; i < 18; i++) {
                    const sx = ((i * 53 + Math.floor(bgScroll * 0.1)) % canvas.width);
                    const sy = 8 + (i * 17) % (groundY - 40);
                    ctx.fillRect(sx, sy, 1, 1);
                }
                drawCitySkyline();
                ctx.fillStyle = groundColor(0);
                ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
                // Road markings
                ctx.fillStyle = 'rgba(80,80,40,0.25)';
                for (let x = (bgScroll * 0.8) % 48; x < canvas.width; x += 48) {
                    ctx.fillRect(x, groundY + 10, 22, 3);
                }
            } else if (redHorror || isWorse) {
                ctx.fillStyle = '#7a0000';
                ctx.fillRect(0, 0, canvas.width, groundY);
                const flashGrad = ctx.createLinearGradient(0, 0, 0, groundY);
                flashGrad.addColorStop(0, 'rgba(20,0,0,0.5)');
                flashGrad.addColorStop(1, 'rgba(0,0,0,0.1)');
                ctx.fillStyle = flashGrad;
                ctx.fillRect(0, 0, canvas.width, groundY);
                ctx.fillStyle = '#1a0000';
                ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
                if (isWorse) drawGroundCracks(0.6);
            } else if (falseCalm) {
                ctx.fillStyle = skyColor(0);
                ctx.fillRect(0, 0, canvas.width, groundY);
                ctx.fillStyle = groundColor(0);
                ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
                ctx.fillStyle = 'rgba(0,0,0,0.08)';
                for (let x = bgScroll; x < canvas.width; x += 40) {
                    ctx.fillRect(x, groundY, 20, canvas.height - groundY);
                }
                drawGroundCracks(0.2);
            } else {
                ctx.fillStyle = skyColor(dreadAmount);
                ctx.fillRect(0, 0, canvas.width, groundY);
                ctx.fillStyle = groundColor(dreadAmount);
                ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
                ctx.fillStyle = 'rgba(0,0,0,0.1)';
                for (let x = bgScroll; x < canvas.width; x += 40) {
                    ctx.fillRect(x, groundY, 20, canvas.height - groundY);
                }
                drawGroundCracks(dreadAmount);
            }

            // Ambient motes (only in play)
            if (gameState === 'PLAYING' || gameState === 'PLAYING_CORRUPT') {
                particles.forEach(p => {
                    let col;
                    if (redHorror || isWorse) col = 'rgba(120,0,0,0.7)';
                    else if (falseCalm) col = 'rgba(30,50,30,0.3)';
                    else col = `rgba(10,10,10,${0.15 + dreadAmount * 0.25})`;
                    ctx.fillStyle = col;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fill();
                });

                if (player.flickerOn) {
                    // At level 100+ (false calm) use original leaf texture; corrupt only in red horror / worse
                    const useCorruptSprite = postCorrupt && !falseCalm;
                    const sprite = useCorruptSprite ? artMatrices.leafCorrupt : artMatrices.leaf;
                    let color = '#2e7d32';
                    if (useCorruptSprite) color = (redHorror || isWorse) ? '#e8c8c8' : '#a8c8a0';
                    else if (falseCalm) color = '#2e7d32'; // restore classic green during false calm
                    if (inCity) color = '#c8e0a8'; // slightly lit by torch
                    if (glitchWorldMode) color = '#ff69b4'; // hot pink fill, blue outline via drawMatrix
                    const pixelSize = player.width / sprite[0].length;
                    drawMatrix(sprite, player.x, player.y, pixelSize, color);
                    // Minecraft torch glow (level 300+)
                    if (level >= CITY_LEVEL) {
                        drawTorchGlow(player.x, player.y);
                    }
                }

                obstacles.forEach(o => {
                    // At level 100+ (false calm) use original spike texture; shard only in red horror / worse
                    const useCorruptSprite = postCorrupt && !falseCalm;
                    const sprite = useCorruptSprite ? artMatrices.shard : artMatrices.spike;
                    let color = useCorruptSprite ? ((redHorror || isWorse) ? '#c9c9c9' : '#6d5d5d') : '#5d1a1a';
                    if (inCity) color = '#3a3a45';
                    if (glitchWorldMode) color = '#ff1493'; // deep pink fill + blue outline
                    const ps = o.width / sprite[0].length;
                    drawMatrix(sprite, o.x, o.y, ps, color);
                });

                // Slow-chasing monster (after jumpscare → level 100)
                if (chaseActive && chaseMonster && scareLoaded) {
                    const m = chaseMonster;
                    ctx.imageSmoothingEnabled = false;
                    ctx.drawImage(scareImg, m.x, m.y, m.w, m.h);
                    // Moving eyes
                    const eyeOff = Math.sin(m.eyePhase) * (m.w * 0.04);
                    const pr = Math.max(2, m.w * SCARE_PUPIL_R);
                    const lx = m.x + SCARE_EYE_L.x * m.w + eyeOff;
                    const ly = m.y + SCARE_EYE_L.y * m.h;
                    const rx = m.x + SCARE_EYE_R.x * m.w + eyeOff;
                    const ry = m.y + SCARE_EYE_R.y * m.h;
                    ctx.fillStyle = '#e8e8e8';
                    ctx.beginPath();
                    ctx.ellipse(lx, ly, pr * 1.7, pr * 1.4, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.ellipse(rx, ry, pr * 1.7, pr * 1.4, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#0a0a0a';
                    ctx.beginPath();
                    ctx.arc(lx, ly, pr, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(rx, ry, pr, 0, Math.PI * 2);
                    ctx.fill();
                }

                // City monster chase (309–320)
                if (cityChaseActive && cityMonster && cityMonsterLoaded) {
                    const m = cityMonster;
                    ctx.imageSmoothingEnabled = false;
                    ctx.drawImage(cityMonsterImg, m.x, m.y, m.w, m.h);
                    // Moving eyes on the pale face
                    const eyeOff = Math.sin(m.eyePhase) * (m.w * 0.035);
                    const pr = Math.max(2, m.w * CITY_PUPIL_R);
                    const lx = m.x + CITY_EYE_L.x * m.w + eyeOff;
                    const ly = m.y + CITY_EYE_L.y * m.h;
                    const rx = m.x + CITY_EYE_R.x * m.w + eyeOff;
                    const ry = m.y + CITY_EYE_R.y * m.h;
                    ctx.fillStyle = '#f0e8d0';
                    ctx.beginPath();
                    ctx.ellipse(lx, ly, pr * 1.6, pr * 1.3, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.ellipse(rx, ry, pr * 1.6, pr * 1.3, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#050505';
                    ctx.beginPath();
                    ctx.arc(lx, ly, pr, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(rx, ry, pr, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // Distortion & effects only during play
            if (gameState === 'PLAYING' || gameState === 'PLAYING_CORRUPT') {
                const distAmt = Math.min(1, Math.max(0, (level - 5) / 35));
                let distStrength = distAmt * 0.7;
                if (redHorror) distStrength = Math.min(1, 0.55 + (level - 30) * 0.015);
                else if (falseCalm) distStrength = 0.25 + Math.min(0.2, (level - 100) * 0.003);
                else if (isWorse) distStrength = Math.min(1, 0.6 + (level - 200) * 0.01);
                drawDistortion(distStrength, redHorror || isWorse);

                if (inCity) {
                    drawVignette(0.55);
                    drawStaticNoise(0.08);
                } else if (redHorror) {
                    drawStaticNoise(0.35 + Math.min(0.35, (level - 30) * 0.015));
                } else if (isWorse) {
                    drawStaticNoise(0.4 + Math.min(0.4, (level - 200) * 0.01));
                    drawVignette(0.4 + Math.min(0.4, (level - 200) * 0.008));
                } else if (falseCalm) {
                    drawStaticNoise(0.12);
                    drawVignette(0.15);
                } else {
                    drawVignette(dreadAmount * 0.75 + distAmt * 0.15);
                    if (distAmt > 0.4) drawStaticNoise(distAmt * 0.25);
                }

                if (isWorse && brightnessMod !== 1) {
                    if (brightnessMod < 1) {
                        ctx.fillStyle = `rgba(0,0,0,${1 - brightnessMod})`;
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                    } else {
                        ctx.fillStyle = `rgba(255,240,230,${(brightnessMod - 1) * 0.45})`;
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                    }
                }
            }

            // UI
            ctx.fillStyle = glitchWorldMode ? '#00bfff' : ((redHorror || isWorse) ? '#e8c8c8' : (inCity ? '#d8d0a8' : '#fff'));
            ctx.font = '16px monospace';
            ctx.textAlign = 'left';

            if (gameState === 'PLAYING' || gameState === 'PLAYING_CORRUPT') {
                ctx.fillText(t('dist') + ': ' + Math.floor(distance), 10, 24);
                ctx.font = '12px monospace';
                ctx.fillText(t('level') + ' ' + level, 10, 42);
                ctx.font = '9px monospace';
                ctx.fillStyle = 'rgba(255,255,85,0.7)';
                ctx.fillText('Java Edition', 10, 56);
                ctx.fillStyle = glitchWorldMode ? '#00bfff' : ((redHorror || isWorse) ? '#e8c8c8' : (inCity ? '#d8d0a8' : '#fff'));
                drawPauseIcon();

                if (glitchWorldMode) {
                    ctx.fillStyle = 'rgba(255,20,147,0.85)';
                    ctx.fillRect(canvas.width - 108, 8, 100, 18);
                    ctx.strokeStyle = '#00bfff';
                    ctx.lineWidth = 1.5;
                    ctx.strokeRect(canvas.width - 108, 8, 100, 18);
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 10px monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText('GLITCH WORLD', canvas.width - 58, 21);
                    ctx.textAlign = 'left';
                }

                if (warningText) {
                    const intense = redHorror || isWorse;
                    const alpha = Math.min(1, warningText.life / 12) *
                                  Math.min(1, (warningText.maxLife - warningText.life) / 8);
                    const glitchX = (Math.random() - 0.5) * (intense ? 4 : 1.5);
                    const glitchY = (Math.random() - 0.5) * (intense ? 3 : 1);
                    ctx.save();
                    ctx.globalAlpha = alpha * (intense ? 0.95 : 0.75);
                    ctx.fillStyle = intense ? '#ffcccc' : '#c8c8c8';
                    ctx.font = (intense ? 'bold ' : '') + warningText.size + 'px monospace';
                    ctx.textAlign = 'left';
                    ctx.fillText(warningText.str, warningText.x + glitchX, warningText.y + glitchY);
                    if (intense || Math.random() < 0.4) {
                        ctx.globalAlpha = alpha * 0.25;
                        ctx.fillStyle = intense ? '#ff2222' : '#888';
                        ctx.fillText(warningText.str, warningText.x + glitchX + 2, warningText.y + glitchY);
                    }
                    ctx.restore();
                }
            } else if (gameState === 'START') {
                drawMainMenu();
            } else if (gameState === 'SETTINGS') {
                drawSettings();
            } else if (gameState === 'ACHIEVEMENTS') {
                drawAchievements();
            } else if (gameState === 'LEADERBOARD') {
                drawLeaderboard();
            }

            if (isPaused) {
                drawPauseOverlay();
            }

            // Achievement unlock toast
            if (achievementToast) {
                const a = ACHIEVEMENTS.find(x => x.id === achievementToast.id);
                if (a) {
                    const alpha = Math.min(1, achievementToast.life / 30, (180 - achievementToast.life) / 20);
                    ctx.save();
                    ctx.globalAlpha = Math.max(0, alpha);
                    ctx.fillStyle = 'rgba(20,40,20,0.92)';
                    ctx.fillRect(80, 8, 320, 42);
                    ctx.strokeStyle = '#4caf50';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(80, 8, 320, 42);
                    ctx.textAlign = 'left';
                    ctx.font = '16px monospace';
                    ctx.fillStyle = '#fff';
                    ctx.fillText(a.icon + ' ' + a.name, 92, 26);
                    ctx.font = '10px monospace';
                    ctx.fillStyle = '#a5d6a7';
                    ctx.fillText(a.desc, 92, 42);
                    ctx.restore();
                }
            }

            ctx.restore();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
