<!DOCTYPE html>

    <title>LeafRun Java Edition</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 0;
        }
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 66.67vw;
            max-height: 100vh;
            max-width: 150vh;
            background: #87ceeb;
            border: none;
            box-shadow: none;
        }
        @media (min-aspect-ratio: 3/2) {
            #gameContainer {
                height: 100vh;
                width: 150vh;
            }
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        #shineOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(
                to bottom,
                rgba(255, 255, 255, 0.28) 0%,
                rgba(255, 255, 255, 0.12) 50%,
                rgba(255, 255, 255, 0.0) 100%
            );
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>

        // ---------- Minecraft-style Text-to-Speech (Web Speech API) ----------
        let ttsVoice = null;
        let ttsReady = false;

        function pickMinecraftVoice() {
            if (!window.speechSynthesis) return null;
            const voices = speechSynthesis.getVoices() || [];
            // Prefer voices that sound closer to the classic robotic Minecraft narrator
            const preferred = [
                /microsoft david/i,
                /microsoft mark/i,
                /google uk english male/i,
                /google us english/i,
                /daniel/i,
                /alex/i,
                /fred/i,
                /english.*male/i,
                /en-us/i,
                /en-gb/i,
                /en-/i
            ];
            for (const re of preferred) {
                const v = voices.find(x => re.test(x.name) || re.test(x.lang));
                if (v) return v;
            }
            return voices.find(v => v.lang && v.lang.toLowerCase().startsWith('en')) || voices[0] || null;
        }

        function initTTS() {
            if (!window.speechSynthesis) return;
            ttsVoice = pickMinecraftVoice();
            ttsReady = true;
            // Chrome loads voices async
            if (speechSynthesis.onvoiceschanged !== undefined) {
                speechSynthesis.onvoiceschanged = function() {
                    ttsVoice = pickMinecraftVoice();
                };
            }
        }
        try { initTTS(); } catch (e) {}

        function speak(text, opts) {
            if (!a11yTTS || !text || !window.speechSynthesis) return;
            opts = opts || {};
            try {
                // Cancel current utterance unless queueing
                if (!opts.queue) speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(String(text));
                // Minecraft narrator-ish: slower, lower pitch, steady
                u.rate = opts.rate != null ? opts.rate : 0.88;
                u.pitch = opts.pitch != null ? opts.pitch : 0.72;
                u.volume = Math.max(0, Math.min(1, (opts.volume != null ? opts.volume : 1) * masterVolume));
                if (!ttsVoice) ttsVoice = pickMinecraftVoice();
                if (ttsVoice) u.voice = ttsVoice;
                // Prefer English for narrator consistency (Minecraft style)
                u.lang = (ttsVoice && ttsVoice.lang) || 'en-US';
                speechSynthesis.speak(u);
            } catch (e) {}
        }

        function stopSpeak() {
            try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) {}
        }

        function achievementAccentColor(diff, unlocked) {
            if (!unlocked) return { bg: 'rgba(40,40,40,0.6)', name: '#666', desc: '#555', border: '#333' };
            if (diff === 'too_easy') {
                return { bg: 'rgba(46,125,50,0.28)', name: '#81c784', desc: '#a5d6a7', border: '#4caf50' };
            }
            if (diff === 'easy') {
                return { bg: 'rgba(180,140,20,0.28)', name: '#ffd54f', desc: '#ffe082', border: '#ffc107' };
            }
            // Rainbow for medium / hard / harder — shift speed by difficulty
            const speed = diff === 'harder' ? 0.012 : (diff === 'hard' ? 0.008 : 0.005);
            const hue = (Date.now() * speed) % 360;
            const sat = diff === 'harder' ? 90 : (diff === 'hard' ? 80 : 70);
            const light = diff === 'harder' ? 65 : 60;
            const c = `hsl(${hue}, ${sat}%, ${light}%)`;
            const c2 = `hsl(${(hue + 40) % 360}, ${sat}%, ${light - 10}%)`;
            return { bg: `hsla(${hue}, ${sat}%, ${light}%, 0.22)`, name: c, desc: c2, border: c };
        }

        function submitLeaderboardScore(dist, lv) {
            const entry = {
                name: (playerName || 'Player').slice(0, 12),
                distance: Math.floor(dist),
                level: lv || 1,
                glitch: !!glitchWorldMode,
                time: Date.now()
            };
            leaderboard.push(entry);
            leaderboard.sort((a, b) => b.distance - a.distance || b.level - a.level || a.time - b.time);
            leaderboard = leaderboard.slice(0, LB_MAX);
            saveStats();
            return leaderboard.findIndex(e => e.time === entry.time && e.distance === entry.distance) + 1;
        }

        function promptPlayerName() {
            try {
                const n = window.prompt('Enter your name for the leaderboard (max 12 chars):', playerName || 'Player');
                if (n !== null && String(n).trim()) {
                    playerName = String(n).trim().slice(0, 12);
                    saveStats();
                }
            } catch (e) {}
        }

        function unlockAchievement(id) {
            if (unlockedAchievements[id]) return;
            unlockedAchievements[id] = true;
            saveStats();
            achievementToast = { id: id, life: 180 };
            try { playSound('score'); } catch (e) {}
            const a = ACHIEVEMENTS.find(x => x.id === id);
            if (a) speak('Achievement unlocked. ' + a.name + '. ' + a.desc);
        }

        function checkDeathAchievements(cause) {
            stats.deaths += 1;
            if (cause === 'obstacle') stats.deathsObstacle += 1;
            if (cause === 'chase') stats.deathsChase += 1;
            if (cause === 'city') stats.deathsCity += 1;
            saveStats();

            unlockAchievement('first_death');
            if (stats.deaths >= 10) unlockAchievement('deaths_10');
            if (stats.deaths >= 50) unlockAchievement('deaths_50');
            if (stats.deaths >= 100) unlockAchievement('deaths_100');
            if (cause === 'obstacle') unlockAchievement('died_obstacle');
            if (cause === 'chase') unlockAchievement('died_chase');
            if (cause === 'city') unlockAchievement('died_city');
        }

        function checkLevelAchievements(lv) {
            if (lv >= 30) {
                unlockAchievement('reach_30');
                if (glitchWorldMode) unlockAchievement('something_is_off');
            }
            if (lv >= 90) {
                unlockAchievement('reach_90');
                if (glitchWorldMode) unlockAchievement('something_is_here');
            }
            if (lv >= 300) unlockAchievement('reach_300');
            if (lv >= 320) unlockAchievement('reach_320');
        }

        function checkWinAchievements() {
            stats.wins += 1;
            if (distance > 0) submitLeaderboardScore(distance, level);
            saveStats();
            unlockAchievement('ending');
            unlockAchievement('first_win');
            unlockAchievement('messed_up_chunks'); // Badge: beat the game
        }

        loadStats();
        // First login achievement
        if (!stats.firstLogin) {
            stats.firstLogin = true;
            saveStats();
            unlockAchievement('first_login');
        }

        function noteFreq(semitones) {

        // Genesis-style square lead with fast attack / quick decay

        // Simple noise "kick/hat" click for rhythm (Genesis often layered percussion)
        function playMenuPerc(kind) {
            if (!audioCtx || !masterGainNode || !menuMusicActive) return;
            try {
                const bufSize = audioCtx.sampleRate * 0.06;
                const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
                const data = buf.getChannelData(0);

                filt.type = kind === 'kick' ? 'lowpass' : 'highpass';
                filt.frequency.setValueAtTime(kind === 'kick' ? 180 : 4500, audioCtx.currentTime);
                const g = audioCtx.createGain();
                g.gain.setValueAtTime(kind === 'kick' ? 0.07 : 0.035, audioCtx.currentTime);

            // Bass thud on beats 0, 4, 8, 12
            if (step % 4 === 0) {
                playGlitchNote(55 + Math.random() * 8, 0.22, 'square', 0.05);
            }

            // Noise / static glitch bursts
            if (Math.random() < 0.22) {
                playGlitchNoiseBurst(0.04 + Math.random() * 0.1, 0.04 + Math.random() * 0.05);
            }

            // Rare "skip" silence already handled by random; occasional double-hit stutter
            if (Math.random() < 0.12) {
                setTimeout(function() {
                    if (glitchSongActive) playGlitchNote(freq * 1.01, 0.08, 'square', 0.03);
                }, 40 + Math.random() * 50);
            }
        }

        function startGlitchSong() {
            if (!audioCtx || !masterGainNode || glitchSongActive) return;
            try {
                stopGlitchSong();
                glitchSongGain = audioCtx.createGain();
                glitchSongGain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
                glitchSongGain.connect(masterGainNode);
                glitchSongGain.gain.setTargetAtTime(0.55, audioCtx.currentTime, 1.0);
                glitchSongNodes = [];
                glitchSongStep = 0;
                glitchSongActive = true;
                // ~140 BPM broken pulse
                glitchSongInterval = setInterval(glitchSongTick, 214);
                glitchSongTick();
            } catch (e) {
                glitchSongActive = false;
            }
        }

        function startWhistle() {
            if (!audioCtx || !masterGainNode || whistleActive) return;
            try {
                try { if (whistleOsc1) whistleOsc1.stop(); } catch (e) {}
                try { if (whistleOsc2) whistleOsc2.stop(); } catch (e) {}
                try { if (whistleLfo) whistleLfo.stop(); } catch (e) {}

                whistleGain = audioCtx.createGain();
                whistleGain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
                whistleGain.connect(masterGainNode);

                whistleOsc1 = audioCtx.createOscillator();
                whistleOsc1.type = 'sine';
                whistleOsc1.frequency.setValueAtTime(1850, audioCtx.currentTime);

                whistleOsc2 = audioCtx.createOscillator();
                whistleOsc2.type = 'sine';
                whistleOsc2.frequency.setValueAtTime(1920, audioCtx.currentTime);

                whistleLfo = audioCtx.createOscillator();
                whistleLfo.type = 'sine';
                whistleLfo.frequency.setValueAtTime(0.35, audioCtx.currentTime);
                whistleLfoGain = audioCtx.createGain();
                whistleLfoGain.gain.setValueAtTime(18, audioCtx.currentTime);
                whistleLfo.connect(whistleLfoGain);
                whistleLfoGain.connect(whistleOsc1.frequency);
                whistleLfoGain.connect(whistleOsc2.frequency);

                whistleOsc1.connect(whistleGain);
                whistleOsc2.connect(whistleGain);

                whistleOsc1.start();
                whistleOsc2.start();
                whistleLfo.start();

                whistleActive = true;
                whistleGain.gain.setTargetAtTime(0.028, audioCtx.currentTime, 1.2);
            } catch (e) {
                whistleActive = false;
            }
        }

        function stopWhistle() {
            if (!whistleGain) return;
            try {
                whistleGain.gain.setTargetAtTime(0.0001, audioCtx.currentTime, 0.4);
            } catch (e) {}
            whistleActive = false;
        }

        function updateWhistle(active) {
            if (!audioCtx) return;
            // Glitch World at level 30+ (post-blackout / PLAYING_CORRUPT): replace whistle with corrupted song
            const useGlitchSong = !!glitchWorldMode && active;
            if (isPaused) {
                if (whistleGain) {
                    try { whistleGain.gain.setTargetAtTime(0.0001, audioCtx.currentTime, 0.2); } catch (e) {}
                }
                if (glitchSongGain) {
                    try { glitchSongGain.gain.setTargetAtTime(0.0001, audioCtx.currentTime, 0.2); } catch (e) {}
                }
                return;
            }
            if (active) {
                if (useGlitchSong) {
                    // Prefer corrupted song; silence classic whistle
                    if (whistleActive) stopWhistle();
                    if (!glitchSongActive) startGlitchSong();
                    else if (glitchSongGain) {
                        try { glitchSongGain.gain.setTargetAtTime(0.55, audioCtx.currentTime, 0.5); } catch (e) {}
                    }
                } else {
                    if (glitchSongActive) stopGlitchSong();
                    if (!whistleActive) startWhistle();
                    else if (whistleGain) {
                        try { whistleGain.gain.setTargetAtTime(0.028, audioCtx.currentTime, 0.5); } catch (e) {}
                    }
                }
            } else {
                stopWhistle();
                stopGlitchSong();
            }
        }

        function canPause() {
            return gameState === 'PLAYING' || gameState === 'PLAYING_CORRUPT';
        }

        function togglePause() {
            if (!canPause()) return;
            isPaused = !isPaused;
            playSound('click');
            if (isPaused) {
                speak('Paused.');
                updateDrone(0);
                updateWhistle(false);
                try { if (chaseAudio) chaseAudio.pause(); } catch (e) {}
            } else {
                speak('Resumed.');
                try {
                    if (chaseActive && chaseAudio) {
                        chaseAudio.volume = Math.max(0, Math.min(1, masterVolume * 0.85));
                        const p = chaseAudio.play();
                        if (p && typeof p.catch === 'function') p.catch(function() {});
                    }
                } catch (e) {}
            }
        }

        // When > 0, title plays a glitch recovery animation then settles to normal
        let menuTitleGlitchTimer = 0;
        const MENU_TITLE_GLITCH_DURATION = 90; // frames ~1.5s

        function goToMenu() {
            const wasGlitch = glitchWorldMode;
            isPaused = false;
            gameState = 'START';
            glitchWorldMode = false;
            obstacles = [];
            particles = [];
            stopChase();
            updateDrone(0);
            updateWhistle(false);
            whistleActive = false;
            playSound('click');
            startMenuMusic();
            // Leaving Glitch World: brief title glitch that restores to normal
            if (wasGlitch) {
                menuTitleGlitchTimer = MENU_TITLE_GLITCH_DURATION;
                speak('Returned to menu. Leaving Glitch World.');
            } else {
                speak('Main menu.');
            }
        }

        function handleInputEvent(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const canvasX = ((clientX - rect.left) / rect.width) * canvas.width;
            const canvasY = ((clientY - rect.top) / rect.height) * canvas.height;

            if (isPaused) {
                if (canvasX >= resumeBtnArea.x && canvasX <= resumeBtnArea.x + resumeBtnArea.w &&
                    canvasY >= resumeBtnArea.y && canvasY <= resumeBtnArea.y + resumeBtnArea.h) {
                    isPaused = false;
                    playSound('click');
                    return;
                }
                if (canvasX >= restartBtnArea.x && canvasX <= restartBtnArea.x + restartBtnArea.w &&
                    canvasY >= restartBtnArea.y && canvasY <= restartBtnArea.y + restartBtnArea.h) {
                    playSound('click');
                    startGame();
                    return;
                }
                if (canvasX >= menuBtnArea.x && canvasX <= menuBtnArea.x + menuBtnArea.w &&
                    canvasY >= menuBtnArea.y && canvasY <= menuBtnArea.y + menuBtnArea.h) {
                    goToMenu();
                    return;
                }
                return;
            }

            if (gameState === 'WARNING') {
                if (canvasX >= warnContinueBtnArea.x && canvasX <= warnContinueBtnArea.x + warnContinueBtnArea.w &&
                    canvasY >= warnContinueBtnArea.y && canvasY <= warnContinueBtnArea.y + warnContinueBtnArea.h) {
                    initAudio();
                    playSound('click');
                    gameState = 'START';
                    startMenuMusic();
                    speak('Main menu. Leaf Run. Tap start to play.');
                }
            } else if (gameState === 'START') {
                if (canvasX >= startBtnArea.x && canvasX <= startBtnArea.x + startBtnArea.w &&
                    canvasY >= startBtnArea.y && canvasY <= startBtnArea.y + startBtnArea.h) {
                    initAudio();
                    playSound('click');
                    startGame();
                } else if (canvasX >= settingsBtnArea.x && canvasX <= settingsBtnArea.x + settingsBtnArea.w &&
                           canvasY >= settingsBtnArea.y && canvasY <= settingsBtnArea.y + settingsBtnArea.h) {
                    initAudio();
                    playSound('click');
                    gameState = 'SETTINGS';
                    langScroll = 0;
                } else if (canvasX >= achievementsBtnArea.x && canvasX <= achievementsBtnArea.x + achievementsBtnArea.w &&
                           canvasY >= achievementsBtnArea.y && canvasY <= achievementsBtnArea.y + achievementsBtnArea.h) {
                    initAudio();
                    playSound('click');
                    gameState = 'ACHIEVEMENTS';
                    achScroll = 0;
                } else if (canvasX >= leaderboardBtnArea.x && canvasX <= leaderboardBtnArea.x + leaderboardBtnArea.w &&
                           canvasY >= leaderboardBtnArea.y && canvasY <= leaderboardBtnArea.y + leaderboardBtnArea.h) {
                    initAudio();
                    playSound('click');
                    gameState = 'LEADERBOARD';
                    speak('Leaderboard. Local scores on this device.');
                } else if (isGlitchEventActive() &&
                           canvasX >= glitchEventBtnArea.x && canvasX <= glitchEventBtnArea.x + glitchEventBtnArea.w &&
                           canvasY >= glitchEventBtnArea.y && canvasY <= glitchEventBtnArea.y + glitchEventBtnArea.h) {
                    initAudio();
                    playSound('click');
                    startGame({ glitchWorld: true });
                }
            } else if (gameState === 'ACHIEVEMENTS') {
                // Scroll arrows
                if (canvasX >= 435 && canvasX <= 465 && canvasY >= 72 && canvasY < 95) {
                    if (achScroll > 0) { achScroll--; playSound('click'); }
                    return;
                }
                if (canvasX >= 435 && canvasX <= 465 && canvasY >= 230 && canvasY < 260) {
                    const maxScroll = Math.max(0, ACHIEVEMENTS.length - 5);
                    if (achScroll < maxScroll) { achScroll++; playSound('click'); }
                    return;
                }
                // Back
                if (canvasX >= achBackBtnArea.x && canvasX <= achBackBtnArea.x + achBackBtnArea.w &&
                    canvasY >= achBackBtnArea.y && canvasY <= achBackBtnArea.y + achBackBtnArea.h) {
                    playSound('click');
                    gameState = 'START';
                }
            } else if (gameState === 'LEADERBOARD') {
                if (canvasX >= lbNameBtnArea.x && canvasX <= lbNameBtnArea.x + lbNameBtnArea.w &&
                    canvasY >= lbNameBtnArea.y && canvasY <= lbNameBtnArea.y + lbNameBtnArea.h) {
                    playSound('click');
                    promptPlayerName();
                    return;
                }
                if (canvasX >= lbBackBtnArea.x && canvasX <= lbBackBtnArea.x + lbBackBtnArea.w &&
                    canvasY >= lbBackBtnArea.y && canvasY <= lbBackBtnArea.y + lbBackBtnArea.h) {
                    playSound('click');
                    gameState = 'START';
                }
            } else if (gameState === 'TUTORIAL') {
                // Skip
                if (canvasX >= tutSkipBtnArea.x && canvasX <= tutSkipBtnArea.x + tutSkipBtnArea.w &&
                    canvasY >= tutSkipBtnArea.y && canvasY <= tutSkipBtnArea.y + tutSkipBtnArea.h) {
                    playSound('click');
                    finishTutorialAndStart();
                    return;
                }
                // Next / Start
                if (canvasX >= tutNextBtnArea.x && canvasX <= tutNextBtnArea.x + tutNextBtnArea.w &&
                    canvasY >= tutNextBtnArea.y && canvasY <= tutNextBtnArea.y + tutNextBtnArea.h) {
                    playSound('click');
                    if (tutorialStep < TUTORIAL_STEPS - 1) {
                        tutorialStep++;
                        const titles = [t('tut1Title'), t('tut2Title'), t('tut3Title'), t('tut4Title')];
                        speak(titles[tutorialStep] || 'Next');
                    } else {
                        finishTutorialAndStart();
                    }
                    return;
                }
            } else if (gameState === 'SETTINGS') {
                // Volume bar click/drag start
                if (canvasX >= volBar.x && canvasX <= volBar.x + volBar.w &&
                    canvasY >= volBar.y - 8 && canvasY <= volBar.y + volBar.h + 8) {
                    const ratio = (canvasX - volBar.x) / volBar.w;
                    setMasterVolume(ratio);
                    playSound('click');
                    return;
                }
                // Accessibility toggles
                // Parent Mode toggle
                if (canvasX >= parentModeArea.x && canvasX <= parentModeArea.x + parentModeArea.w &&
                    canvasY >= parentModeArea.y && canvasY <= parentModeArea.y + parentModeArea.h) {
                    parentMode = !parentMode;
                    if (parentMode) {
                        a11yReduceMotion = true;
                        a11yReduceFlash = true;
                        a11yNoJumpscare = true;
                    }
                    saveA11y();
                    playSound('click');
                    return;
                }
                for (let i = 0; i < a11yToggleAreas.length; i++) {
                    const area = a11yToggleAreas[i];
                    if (canvasX >= area.x && canvasX <= area.x + area.w &&
                        canvasY >= area.y && canvasY <= area.y + area.h) {
                        if (area.key === 'motion') a11yReduceMotion = !a11yReduceMotion;
                        else if (area.key === 'flash') a11yReduceFlash = !a11yReduceFlash;
                        else if (area.key === 'jumpscare') a11yNoJumpscare = !a11yNoJumpscare;
                        else if (area.key === 'tts') {
                            a11yTTS = !a11yTTS;
                            if (a11yTTS) {
                                initTTS();
                                speak('Text to speech enabled. Minecraft narrator style.');
                            } else {
                                stopSpeak();
                            }
                        }
                        // Turning any individual off also turns Parent Mode off
                        if (!a11yReduceMotion || !a11yReduceFlash || !a11yNoJumpscare) {
                            parentMode = false;
                        }
                        saveA11y();
                        playSound('click');
                        return;
                    }
                }
                // Language rows (visible 4)
                const visible = 4;
                for (let i = 0; i < visible; i++) {
                    const idx = langScroll + i;
                    if (idx >= LANGS.length) break;
                    const y = langListTop + i * langRowH;
                    if (canvasX >= 80 && canvasX <= 400 && canvasY >= y && canvasY < y + langRowH) {
                        currentLang = LANGS[idx].code;
                        try { localStorage.setItem('leafrun_java_lang', currentLang); } catch (e) {}
                        playSound('click');
                        return;
                    }
                }
                // Scroll arrows
                if (canvasX >= 415 && canvasX <= 450 && canvasY >= langListTop && canvasY < langListTop + 18) {
                    if (langScroll > 0) { langScroll--; playSound('click'); }
                    return;
                }
                if (canvasX >= 415 && canvasX <= 450 && canvasY >= langListTop + 3 * langRowH && canvasY < langListTop + 4 * langRowH + 4) {
                    if (langScroll < LANGS.length - 4) { langScroll++; playSound('click'); }
                    return;
                }
                // Back
                if (canvasX >= backBtnArea.x && canvasX <= backBtnArea.x + backBtnArea.w &&
                    canvasY >= backBtnArea.y && canvasY <= backBtnArea.y + backBtnArea.h) {
                    playSound('click');
                    gameState = 'START';
                }
            } else if (gameState === 'PLAYING' || gameState === 'PLAYING_CORRUPT') {
                if (canvasX >= pauseIconArea.x && canvasX <= pauseIconArea.x + pauseIconArea.w &&
                    canvasY >= pauseIconArea.y && canvasY <= pauseIconArea.y + pauseIconArea.h) {
                    togglePause();
                    return;
                }
                if (player.isGrounded) {
                    player.velocity = player.jumpStrength;
                    player.isGrounded = false;
                    playSound('jump');
                }
            } else if (gameState === 'GAMEOVER') {
                if (deathScreenTimer > 40 &&
                    canvasX >= retryBtnArea.x && canvasX <= retryBtnArea.x + retryBtnArea.w &&
                    canvasY >= retryBtnArea.y && canvasY <= retryBtnArea.y + retryBtnArea.h) {
                    playSound('click');
                    startGame();
                }
            } else if (gameState === 'ENDING_DONE') {
                playSound('click');
                goToMenu();
            }
        }

        // Support dragging volume
        let isDraggingVol = false;
        window.addEventListener('mousemove', function(e) {
            if (!isDraggingVol || gameState !== 'SETTINGS') return;
            const rect = canvas.getBoundingClientRect();
            const canvasX = ((e.clientX - rect.left) / rect.width) * canvas.width;
            const ratio = Math.max(0, Math.min(1, (canvasX - volBar.x) / volBar.w));
            setMasterVolume(ratio);
        });
        window.addEventListener('mouseup', function() { isDraggingVol = false; });
        window.addEventListener('touchmove', function(e) {
            if (!isDraggingVol || gameState !== 'SETTINGS' || !e.touches.length) return;
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const canvasX = ((e.touches[0].clientX - rect.left) / rect.width) * canvas.width;
            const ratio = Math.max(0, Math.min(1, (canvasX - volBar.x) / volBar.w));
            setMasterVolume(ratio);
        }, { passive: false });
        window.addEventListener('touchend', function() { isDraggingVol = false; });

        window.addEventListener('touchstart', function(e) {
            e.preventDefault();
            if (e.touches.length > 0) {
                const rect = canvas.getBoundingClientRect();
                const canvasX = ((e.touches[0].clientX - rect.left) / rect.width) * canvas.width;
                const canvasY = ((e.touches[0].clientY - rect.top) / rect.height) * canvas.height;
                if (gameState === 'SETTINGS' &&
                    canvasX >= volBar.x && canvasX <= volBar.x + volBar.w &&
                    canvasY >= volBar.y - 8 && canvasY <= volBar.y + volBar.h + 8) {
                    isDraggingVol = true;
                }
                handleInputEvent(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: false });

        window.addEventListener('mousedown', function(e) {
            const rect = canvas.getBoundingClientRect();
            const canvasX = ((e.clientX - rect.left) / rect.width) * canvas.width;
            const canvasY = ((e.clientY - rect.top) / rect.height) * canvas.height;
            if (gameState === 'SETTINGS' &&
                canvasX >= volBar.x && canvasX <= volBar.x + volBar.w &&
                canvasY >= volBar.y - 8 && canvasY <= volBar.y + volBar.h + 8) {
                isDraggingVol = true;
            }
            handleInputEvent(e.clientX, e.clientY);
        });

        window.addEventListener('keydown', function(e) {
            if (e.code === 'KeyF') {
                e.preventDefault();
                const el = document.documentElement;
                if (!document.fullscreenElement) {
                    (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen)?.call(el);
                } else {
                    (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen)?.call(document);
                }
                return;
            }
            if (e.code === 'Escape' || e.code === 'KeyP') {
                e.preventDefault();
                if (gameState === 'SETTINGS' || gameState === 'ACHIEVEMENTS' || gameState === 'LEADERBOARD') {
                    gameState = 'START';
                    playSound('click');
                    return;
                }
                if (gameState === 'TUTORIAL') {
                    playSound('click');
                    finishTutorialAndStart();
                    return;
                }
                if (canPause()) {
                    togglePause();
                }
                return;
            }
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'Enter') {
                e.preventDefault();
                if (isPaused) {
                    isPaused = false;
                    playSound('click');
                    return;
                }
                if (gameState === 'WARNING') {
                    initAudio();
                    playSound('click');
                    gameState = 'START';
                    startMenuMusic();
                    speak('Main menu. Leaf Run. Tap start to play.');
                    return;
                }
                if (gameState === 'TUTORIAL') {
                    playSound('click');
                    if (tutorialStep < TUTORIAL_STEPS - 1) {
                        tutorialStep++;
                    } else {
                        finishTutorialAndStart();
                    }
                    return;
                }
                if (gameState === 'PLAYING' || gameState === 'PLAYING_CORRUPT') {
                    if (player.isGrounded) {
                        player.velocity = player.jumpStrength;
                        player.isGrounded = false;
                        playSound('jump');
                    }
                } else if (gameState === 'START') {
                    initAudio();
                    startGame();
                } else if (gameState === 'GAMEOVER' && deathScreenTimer > 40) {
                    initAudio();
                    startGame();
                } else if (gameState === 'ENDING_DONE') {
                    initAudio();
                    goToMenu();
                }
            }
        });

        function startChase() {
            if (chaseActive) return;
            chaseActive = true;
            chaseMonster = {
                x: 420,
                y: groundY - 72,
                w: 72,
                h: 72,
                speed: CHASE_MONSTER_SPEED,
                bob: 0,
                eyePhase: 0
            };
            try {
                if (!chaseAudio) {
                    chaseAudio = new Audio(CHASE_AUDIO_SRC);
                    chaseAudio.loop = true;
                    chaseAudio.preload = 'auto';
                }
                chaseAudio.volume = Math.max(0, Math.min(1, masterVolume * 0.85));
                chaseAudio.currentTime = 0;
                const p = chaseAudio.play();
                if (p && typeof p.catch === 'function') p.catch(function() {});
            } catch (e) {}
        }

        function stopChase() {
            chaseActive = false;
            chaseMonster = null;
            try {
                if (chaseAudio) {
                    chaseAudio.pause();
                    chaseAudio.currentTime = 0;
                }
            } catch (e) {}
        }

        function startCityChase() {
            if (cityChaseActive) return;
            cityChaseActive = true;
            cityMonster = {
                x: 430,
                y: groundY - 96,
                w: 96,
                h: 96,
                speed: CITY_MONSTER_SPEED,
                bob: 0,
                eyePhase: 0
            };
        }

        function stopCityChase() {
            cityChaseActive = false;
            cityMonster = null;
        }

        function startGame(opts) {
            opts = opts || {};
            pendingStartOpts = opts;
            stopMenuMusic();
            smileyLoadTimer = 0;
            gameState = 'SMILEY_LOAD';
            isPaused = false;
        }

        function afterSmileyLoad() {
            const opts = pendingStartOpts || {};
            if (!seenTutorial) {
                tutorialStep = 0;
                gameState = 'TUTORIAL';
                isPaused = false;
                speak('How to play. Tap or press space to jump.');
                return;
            }
            pendingStartOpts = null;
            beginPlay(opts);
        }

        function finishTutorialAndStart() {

            seenTutorial = true;
            try { localStorage.setItem('leafrun_java_tutorial', '1'); } catch (e) {}
            const opts = pendingStartOpts || {};
            pendingStartOpts = null;
            tutorialStep = 0;
            beginPlay(opts);
        }

        function beginPlay(opts) {
            opts = opts || {};
            stopMenuMusic();
            stopChase();
            stopCityChase();
            glitchWorldMode = !!opts.glitchWorld;
            if (glitchWorldMode) {
                unlockAchievement('this_is_fine');
                speak('Entering The Glitch World.');
            } else {
                speak('Game start. Tap or press space to jump.');
            }
            gameState = 'PLAYING';
            isPaused = false;
            distance = 0;
            level = 1;
            gameSpeed = 3.8;
            spawnTimer = (5 / 0.05) * 3.8;
            obstacles = [];
            particles = [];
            blackoutTimer = 0;
            screenShake = 0;
            player.y = groundY - player.height;
            player.velocity = 0;
            player.isGrounded = true;
            player.flickerOn = true;
            warningText = null;
            warningCooldown = 120;
            brightnessPulse = 0;
            brightnessMod = 1;
            jumpscareTriggered = false;
            jumpscareTimer = 0;
            jumpscareEyePhase = 0;
            girlfriendTriggered = false;
            girlfriendTimer = 0;
            girlfriendEyePhase = 0;
            girlfriendBlood = [];
            updateDrone(0);
            updateWhistle(false);
            whistleActive = false;
        }

        let lastDeathCause = 'obstacle';
        let deathScreenTimer = 0;

        const DEATH_MESSAGES = {
            obstacle: {
                title: 'CRUSHED',
                what: 'You died to an obstacle.',
                how: 'A solid barrier blocked your path.\nYou could not jump in time.'
            },
            chase: {
                title: 'CAUGHT',
                what: 'You died to the chasing monster.',
                how: 'It followed you through the dark.\nSlow, patient, and inevitable.'
            },
            city: {
                title: 'DEVOURED',
                what: 'You died to the city monster.',
                how: 'In the blacked-out streets\nit found you and did not let go.'
            }
        };

        function triggerGameOver(cause) {
            cause = cause || 'obstacle';
            lastDeathCause = cause;
            deathScreenTimer = 0;
            gameState = 'GAMEOVER';
            isPaused = false;
            stopChase();
            stopCityChase();
            playSound('glitch');
            updateDrone(0);
            const dm = DEATH_MESSAGES[cause] || DEATH_MESSAGES.obstacle;
            speak('Game over. ' + (dm.title || '') + '. ' + (dm.what || ''));
            updateWhistle(false);
            if (distance > highDistance) {
                highDistance = distance;
            }
            // Local leaderboard entry (this device only)
            if (distance > 0) {
                submitLeaderboardScore(distance, level);
            }
            checkDeathAchievements(cause);
            saveStats();
        }

        function spawnObstacle() {
            const size = 18;
            obstacles.push({
                x: 500,
                y: groundY - size,
                width: size,
                height: size,
                passed: false
            });
        }

        function rectsOverlap(a, b) {
            return a.x < b.x + b.width &&
                   a.x + a.width > b.x &&
                   a.y < b.y + b.height &&
                   a.y + a.height > b.y;
        }

        function maybeSpawnParticle(dreadAmount) {
            if (Math.random() < dreadAmount * 0.06) {
                particles.push({
                    x: 500,
                    y: Math.random() * groundY,
                    r: 1 + Math.random() * 2,
                    speed: 0.4 + Math.random() * 0.6,
                    drift: (Math.random() - 0.5) * 0.3,
                    life: 1
                });
            }
        }

        function update() {
            if (isPaused) return;

            // Loading screen countdown
            if (gameState === 'LOADING') {
                loadingTimer += 1;
                // Advance once timer is done (and logo is ready, or after a bit longer if image fails)
                if (loadingTimer >= LOADING_DURATION && (logoLoaded || loadingTimer >= LOADING_DURATION + 60)) {
                    gameState = 'WARNING';
                    speak('Content warning. This game is intended for ages 13 and up. It contains jumpscares, flashing lights, psychological horror, and violence. Press I understand to continue.');
                }
                return;
            }

            // Warning screen — wait for player input (handled in click/key handlers)
            if (gameState === 'WARNING') {
                return;
            }

            // Leaf-run loading screen after hitting Start on title screen
            if (gameState === 'SMILEY_LOAD') {
                smileyLoadTimer += 1;
                if (smileyLoadTimer >= SMILEY_LOAD_DURATION) {
                    afterSmileyLoad();
                }
                return;
            }

            // Title glitch recovery countdown (menu only)
            if (gameState === 'START' && menuTitleGlitchTimer > 0) {
                menuTitleGlitchTimer -= 1;
            }

            const dreadAmount = Math.max(0, Math.min(1, (level - 10) / 20));
            bgScroll = (bgScroll - (gameState.startsWith('PLAYING') ? gameSpeed * 0.5 : 0.8)) % 480;

            if (screenShake > 0) screenShake *= 0.9;
            if (screenShake < 0.05) screenShake = 0;

            if (gameState === 'PLAYING' || gameState === 'PLAYING_CORRUPT') {
                distance += 0.05;
                level = Math.floor(distance / DIST_PER_LEVEL) + 1;
                gameSpeed = Math.min(7.5, 3.8 + (distance * 0.012));
                checkLevelAchievements(level);

                const postCorrupt = gameState === 'PLAYING_CORRUPT';
                const falseCalm = postCorrupt && level >= FALSE_CALM_LEVEL && level < WORSE_LEVEL;
                const isWorse = postCorrupt && level >= WORSE_LEVEL;
                const redHorror = postCorrupt && level < FALSE_CALM_LEVEL;

                updateDrone(parentMode ? 0 : (redHorror ? 0.15 : (isWorse ? 0.25 : (falseCalm ? 0.05 : dreadAmount))));
                updateWhistle(postCorrupt && !parentMode);

                const distAmt = Math.min(1, (level - 5) / 40);
                if (distAmt > 0.1 && Math.random() < distAmt * 0.08) {
                    screenShake = Math.max(screenShake, 1 + distAmt * 3);
                }
                if (isWorse && Math.random() < 0.12) {
                    screenShake = Math.max(screenShake, 2 + Math.random() * 4);
                }

                if (isWorse) {
                    brightnessPulse += 0.04 + Math.random() * 0.02;
                    brightnessMod = 0.9 + Math.sin(brightnessPulse) * 0.35
                                  + Math.sin(brightnessPulse * 1.7) * 0.15;
                    brightnessMod = Math.max(0.55, Math.min(1.3, brightnessMod));
                } else {
                    brightnessMod = 1;
                }

                if (warningText) {
                    warningText.life -= 1;
                    if (warningText.life <= 0) warningText = null;
                } else {
                    warningCooldown -= 1;
                    let spawnChance = Math.max(0, (level - 7) / 25) * 0.012 + dreadAmount * 0.005;
                    if (redHorror) spawnChance = 0.018;
                    else if (falseCalm) spawnChance = 0.008;
                    else if (isWorse) spawnChance = 0.025;
                    if (parentMode) spawnChance = 0; // Parent Mode: no dread/whistle text
                    if (warningCooldown <= 0 && Math.random() < spawnChance) {
                        const pool = postCorrupt ? tPhrases('whistle') : tPhrases('dread');
                        const phrase = pool[Math.floor(Math.random() * pool.length)];
                        warningText = {
                            str: phrase,
                            x: 40 + Math.random() * 280,
                            y: 50 + Math.random() * 160,
                            life: 40 + Math.floor(Math.random() * 30),
                            maxLife: 50,
                            size: 13 + Math.floor(Math.random() * 9)
                        };
                        warningText.maxLife = warningText.life;
                        warningCooldown = redHorror || isWorse
                            ? 40 + Math.random() * 60
                            : 70 + Math.random() * 100;
                    }
                }

                if (level >= ENDING_LEVEL) {
                    startEndingSequence();
                    return;
                }

                // Level 90 jump scare (once per run, after corruption)
                if (postCorrupt && level >= JUMPSCARE_LEVEL && !jumpscareTriggered) {
                    jumpscareTriggered = true;
                    if (a11yNoJumpscare || parentMode) {
                        // Accessibility / Parent Mode: skip full jumpscare
                        // Still allow chase systems to start normally later
                    } else {
                        jumpscareTimer = JUMPSCARE_DURATION;
                        jumpscareEyePhase = 0;
                        gameState = 'JUMPSCARE';
                        playSound('jumpscare');
                        updateDrone(0);
                        updateWhistle(false);
                        if (!a11yReduceMotion) screenShake = 14;
                        return;
                    }
                }

                // Level 150: monster returns with leaf-lookalike girlfriend and kills her
                if (postCorrupt && level >= GIRLFRIEND_LEVEL && !girlfriendTriggered) {
                    girlfriendTriggered = true;
                    if (!a11yNoJumpscare && !parentMode) {
                        girlfriendTimer = GIRLFRIEND_DURATION;
                        girlfriendEyePhase = 0;
                        girlfriendBlood = [];
                        gameState = 'GIRLFRIEND_KILL';
                        playSound('jumpscare');
                        updateDrone(0);
                        updateWhistle(false);
                        if (!a11yReduceMotion) screenShake = 10;
                        return;
                    }
                }

                if (gameState === 'PLAYING' && level >= BLACKOUT_LEVEL) {
                    gameState = 'BLACKOUT';
                    blackoutTimer = BLACKOUT_DURATION;
                    playSound('blackout');
                    updateDrone(0);
                    updateWhistle(false);
                    return;
                }

                player.velocity += player.gravity;
                player.y += player.velocity;

                if (player.y >= groundY - player.height) {
                    player.y = groundY - player.height;
                    player.velocity = 0;
                    player.isGrounded = true;
                    if (postCorrupt) screenShake = 3 + Math.random() * 2;
                }

                let flickerChance;
                if (isWorse) flickerChance = 0.14 + Math.min(0.2, (level - 200) * 0.008);
                else if (falseCalm) flickerChance = 0.04;
                else if (postCorrupt) flickerChance = 0.12 + Math.min(0.12, (level - 30) * 0.01);
                else flickerChance = dreadAmount * 0.05 + distAmt * 0.03;
                player.flickerTimer -= 1;
                if (player.flickerTimer <= 0) {
                    if (Math.random() < flickerChance) {
                        player.flickerOn = !player.flickerOn;
                        player.flickerTimer = 2 + Math.random() * 5;
                    } else {
                        player.flickerOn = true;
                        player.flickerTimer = 8;
                    }
                }

                spawnTimer -= gameSpeed;
                if (spawnTimer <= 0) {
                    spawnObstacle();
                    const gapDist = 5.0 + (Math.random() * 0.4 - 0.2);
                    const frames = gapDist / 0.05;
                    spawnTimer = frames * gameSpeed;
                }

                for (let i = obstacles.length - 1; i >= 0; i--) {
                    const o = obstacles[i];
                    o.x -= gameSpeed;

                    const playerHit = {
                        x: player.x + 7,
                        y: player.y + 6,
                        width: player.width - 14,
                        height: player.height - 12
                    };
                    const obsHit = {
                        x: o.x + 3,
                        y: o.y + 4,
                        width: o.width - 6,
                        height: o.height - 4
                    };

                    if (rectsOverlap(playerHit, obsHit)) {
                        triggerGameOver('obstacle');
                    }

                    if (!o.passed && o.x + o.width < player.x) {
                        o.passed = true;
                        playSound('score');
                    }

                    if (o.x + o.width < -20) {
                        obstacles.splice(i, 1);
                    }
                }

                maybeSpawnParticle(gameState === 'PLAYING_CORRUPT' ? 1 : dreadAmount);
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.x -= p.speed + gameSpeed * 0.2;
                    p.y += p.drift;
                    if (p.x < -10) particles.splice(i, 1);
                }

                // Slow monster chase (levels 90–100)
                if (chaseActive && chaseMonster) {
                    if (level >= CHASE_END_LEVEL) {
                        stopChase();
                    } else {
                        const m = chaseMonster;
                        m.bob += 0.05;
                        m.eyePhase += 0.12;
                        // Creep slowly toward the player
                        const targetX = player.x + player.width * 0.5 - m.w * 0.5;
                        if (m.x > targetX) {
                            m.x -= m.speed;
                        } else {
                            m.x += m.speed * 0.15; // slight lag if ahead
                        }
                        m.y = groundY - m.h + Math.sin(m.bob) * 3;
                        // Keep audio volume synced
                        try {
                            if (chaseAudio) chaseAudio.volume = Math.max(0, Math.min(1, masterVolume * 0.85));
                        } catch (e) {}
                        // Catch player → game over
                        const mHit = { x: m.x + 10, y: m.y + 10, width: m.w - 20, height: m.h - 16 };
                        const pHit = {
                            x: player.x + 7,
                            y: player.y + 6,
                            width: player.width - 14,
                            height: player.height - 12
                        };
                        if (rectsOverlap(mHit, pHit)) {
                            triggerGameOver('chase');
                        }
                    }
                }

                // City monster chase (levels 309–320)
                if (postCorrupt && level >= CITY_MONSTER_LEVEL && level < CITY_CHASE_END_LEVEL) {
                    if (!cityChaseActive) startCityChase();
                }
                if (cityChaseActive && cityMonster) {
                    if (level >= CITY_CHASE_END_LEVEL) {
                        stopCityChase();
                    } else {
                        const m = cityMonster;
                        m.bob += 0.04;
                        m.eyePhase += 0.1;
                        const targetX = player.x + player.width * 0.5 - m.w * 0.5;
                        if (m.x > targetX) {
                            m.x -= m.speed;
                        } else {
                            m.x += m.speed * 0.12;
                        }
                        m.y = groundY - m.h + Math.sin(m.bob) * 4;
                        const mHit = { x: m.x + 12, y: m.y + 14, width: m.w - 24, height: m.h - 20 };
                        const pHit = {
                            x: player.x + 7,
                            y: player.y + 6,
                            width: player.width - 14,
                            height: player.height - 12
                        };
                        if (rectsOverlap(mHit, pHit)) {
                            triggerGameOver('city');
                        }
                    }
                }

            } else if (gameState === 'BLACKOUT') {
                blackoutTimer -= 1;
                if (blackoutTimer === Math.floor(BLACKOUT_DURATION * 0.4)) {
                    playSound('corruptStinger');
                }
                if (blackoutTimer <= 0) {
                    gameState = 'PLAYING_CORRUPT';
                    obstacles = [];
                    particles = [];
                    spawnTimer = (5 / 0.05) * gameSpeed;
                    screenShake = 8;
                    updateWhistle(true);
                }
            } else if (gameState === 'JUMPSCARE') {
                jumpscareTimer -= 1;
                jumpscareEyePhase += 0.18;
                // Keep shaking hard for the first half
                if (jumpscareTimer > JUMPSCARE_DURATION * 0.4) {
                    screenShake = 8 + Math.random() * 10;
                } else {
                    screenShake = Math.max(0, screenShake * 0.92);
                }
                if (jumpscareTimer <= 0) {
                    gameState = 'PLAYING_CORRUPT';
                    screenShake = 4;
                    updateWhistle(true);
                    // Resume ambient dread a bit
                    updateDrone(0.2);
                    // Monster begins slow chase until level 100
                    if (level < CHASE_END_LEVEL) startChase();
                }
            } else if (gameState === 'GIRLFRIEND_KILL') {
                girlfriendTimer -= 1;
                girlfriendEyePhase += 0.14;
                const elapsed = GIRLFRIEND_DURATION - girlfriendTimer;
                // Phases: 0-70 intro, 70-130 approach, 130-180 kill, 180-end aftermath
                if (elapsed < 70) {
                    screenShake = 2 + Math.random() * 3;
                } else if (elapsed < 130) {
                    screenShake = 4 + Math.random() * 5;
                } else if (elapsed < 180) {
                    screenShake = 10 + Math.random() * 12;
                    // Spawn blood particles during kill
                    if (Math.random() < 0.45) {
                        girlfriendBlood.push({
                            x: 290 + (Math.random() - 0.5) * 30,
                            y: 200 + (Math.random() - 0.5) * 20,
                            vx: (Math.random() - 0.5) * 4,
                            vy: -1 - Math.random() * 3,
                            life: 40 + Math.random() * 30,
                            r: 1.5 + Math.random() * 2.5
                        });
                    }
                } else {
                    screenShake = Math.max(0, screenShake * 0.9);
                }
                // Update blood particles
                for (let i = girlfriendBlood.length - 1; i >= 0; i--) {
                    const b = girlfriendBlood[i];
                    b.x += b.vx;
                    b.y += b.vy;
                    b.vy += 0.12;
                    b.life -= 1;
                    if (b.life <= 0) girlfriendBlood.splice(i, 1);
                }
                if (girlfriendTimer <= 0) {
                    gameState = 'PLAYING_CORRUPT';
                    screenShake = 3;
                    updateWhistle(true);
                    updateDrone(0.25);
                    girlfriendBlood = [];
                }
            } else if (gameState === 'ENDING_PARTY') {
                endingTimer += 1;
                // Leaf drifts gently toward the party, sprite settles, screen calms
                if (player.x < 190) player.x += 0.6;
                brightnessMod = 1;
                screenShake = 0;
                partyFriends.forEach(f => { f.bob += f.bobSpeed; });
                if (endingTimer === 40) playSound('score');
                if (endingTimer >= ENDING_PARTY_DURATION) {
                    gameState = 'ENDING_CUTSCENE';
                    endingTimer = 0;
                    updateDrone(0);
                    stopWhistle();
                    playSound('corruptStinger');
                }
            } else if (gameState === 'ENDING_CUTSCENE') {
                endingTimer += 1;
                if (endingTimer >= ENDING_CUTSCENE_DURATION) {
                    gameState = 'ENDING_DONE';
                    endingTimer = 0;
                    checkWinAchievements();
                    speak('The end. You survived Leaf Run. Badge unlocked: Messed Up Chunks.');
                }
            } else if (gameState === 'GAMEOVER') {
                deathScreenTimer += 1;
            }

            // Achievement toast timer
            if (achievementToast) {
                achievementToast.life -= 1;
                if (achievementToast.life <= 0) achievementToast = null;
            }
        }

        function startEndingSequence() {
            gameState = 'ENDING_PARTY';
            endingTimer = 0;
            obstacles = [];
            particles = [];
            screenShake = 0;
            brightnessMod = 1;
            warningText = null;
            player.x = 60;
            player.y = groundY - player.height;
            player.velocity = 0;
            player.flickerOn = true;
            updateDrone(0);
            stopWhistle();
            whistleActive = false;
            partyFriends = [];
            const friendColors = ['#e08a3c', '#4a90d9', '#d94a7a', '#c9c04a', '#7ad94a'];
            for (let i = 0; i < 5; i++) {
                partyFriends.push({
                    x: 260 + i * 40,
                    y: groundY - 26,
                    color: friendColors[i % friendColors.length],
                    bob: Math.random() * Math.PI * 2,
                    bobSpeed: 0.08 + Math.random() * 0.04
                });
            }
        }

        function drawMatrix(matrix, px, py, pixelSize, color) {
            // Blue outline pass in Glitch World (only while playing that mode)
            if (glitchWorldMode && (gameState === 'PLAYING' || gameState === 'PLAYING_CORRUPT')) {
                ctx.fillStyle = '#00bfff'; // deep sky blue outline
                for (let row = 0; row < matrix.length; row++) {
                    for (let col = 0; col < matrix[row].length; col++) {
                        if (matrix[row][col] === 1) {
                            const x = px + col * pixelSize;
                            const y = py + row * pixelSize;
                            // expand 1px for outline
                            ctx.fillRect(x - 1, y - 1, pixelSize + 2, pixelSize + 2);
                        }
                    }
                }
            }
            ctx.fillStyle = color;
            for (let row = 0; row < matrix.length; row++) {
                for (let col = 0; col < matrix[row].length; col++) {
                    if (matrix[row][col] === 1) {
                        ctx.fillRect(
                            px + col * pixelSize,
                            py + row * pixelSize,
                            pixelSize,
                            pixelSize
                        );
                    }
                }
            }
        }

        function skyColor(dreadAmount) {
            if (glitchWorldMode && (gameState === 'PLAYING' || gameState === 'PLAYING_CORRUPT')) {
                // Soft magenta / violet sky for Glitch World (only during play)
                return 'rgb(40, 10, 55)';
            }
            if (level >= CITY_LEVEL) {
                return 'rgb(6,6,12)'; // near-black night city sky
            }
            const r = Math.round(135 - dreadAmount * 120);
            const g = Math.round(206 - dreadAmount * 190);
            const b = Math.round(235 - dreadAmount * 200);
            return `rgb(${r},${g},${b})`;
        }

        function groundColor(dreadAmount) {
            if (glitchWorldMode && (gameState === 'PLAYING' || gameState === 'PLAYING_CORRUPT')) {
                // Pink ground (only during Glitch World play)
                return 'rgb(255, 105, 180)';
            }
            if (level >= CITY_LEVEL) {
                return 'rgb(12,12,16)'; // dark asphalt
            }
            const r = Math.round(80 - dreadAmount * 60);
            const g = Math.round(140 - dreadAmount * 120);
            const b = Math.round(60 - dreadAmount * 50);
            return `rgb(${r},${g},${b})`;
        }

        function drawCitySkyline() {
            // Dark silhouetted buildings scrolling slowly
            const baseY = groundY;
            ctx.fillStyle = '#030308';
            // Far buildings (darker, shorter)
            for (let i = 0; i < 14; i++) {
                const seed = i * 97;
                const x = ((bgScroll * 0.35 + seed * 3) % (canvas.width + 80)) - 40;
                const w = 28 + (seed % 40);
                const h = 40 + (seed % 70);
                ctx.fillRect(x, baseY - h, w, h);
                // occasional window glow
                if ((seed % 5) === 0) {
                    ctx.fillStyle = 'rgba(180,160,80,0.15)';
                    ctx.fillRect(x + 6, baseY - h + 10, 4, 5);
                    ctx.fillRect(x + w - 12, baseY - h + 22, 4, 5);
                    ctx.fillStyle = '#030308';
                }
            }
            // Near buildings (taller)
            ctx.fillStyle = '#010105';
            for (let i = 0; i < 9; i++) {
                const seed = i * 131 + 17;
                const x = ((bgScroll * 0.55 + seed * 5) % (canvas.width + 100)) - 50;
                const w = 36 + (seed % 50);
                const h = 70 + (seed % 90);
                ctx.fillRect(x, baseY - h, w, h);
                // sparse lit windows
                ctx.fillStyle = 'rgba(200,170,60,0.22)';
                const rows = Math.floor(h / 14);
                for (let r = 1; r < rows; r++) {
                    if (((seed + r) % 3) === 0) {
                        ctx.fillRect(x + 8, baseY - h + r * 14, 5, 6);
                        if (((seed + r) % 7) === 0) ctx.fillRect(x + w - 14, baseY - h + r * 14, 5, 6);
                    }
                }
                ctx.fillStyle = '#010105';
            }
            // Faint horizon haze
            const haze = ctx.createLinearGradient(0, baseY - 120, 0, baseY);
            haze.addColorStop(0, 'rgba(0,0,0,0)');
            haze.addColorStop(1, 'rgba(0,0,8,0.45)');
            ctx.fillStyle = haze;
            ctx.fillRect(0, baseY - 120, canvas.width, 120);
        }

        function drawTorchGlow(px, py) {
            // Minecraft-style torch held by the leaf (small stick + flame + radial glow)
            const tx = px + player.width * 0.78;
            const ty = py + player.height * 0.22;
            // Soft orange/yellow glow
            const glow = ctx.createRadialGradient(tx, ty - 6, 1, tx, ty - 4, 48);
            glow.addColorStop(0, 'rgba(255,200,80,0.55)');
            glow.addColorStop(0.35, 'rgba(255,140,40,0.22)');
            glow.addColorStop(1, 'rgba(255,100,20,0)');
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(tx, ty - 4, 48, 0, Math.PI * 2);
            ctx.fill();
            // Stick
            ctx.fillStyle = '#5d4037';
            ctx.fillRect(tx - 2, ty - 2, 4, 14);
            // Flame (animated)
            const flick = Math.sin(Date.now() * 0.012) * 1.5 + Math.sin(Date.now() * 0.027) * 0.8;
            ctx.fillStyle = '#ff9800';
            ctx.beginPath();
            ctx.moveTo(tx - 4, ty - 2);
            ctx.lineTo(tx + 4, ty - 2);
            ctx.lineTo(tx + flick * 0.3, ty - 12 - flick);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#ffeb3b';
            ctx.beginPath();
            ctx.moveTo(tx - 2, ty - 2);
            ctx.lineTo(tx + 2, ty - 2);
            ctx.lineTo(tx, ty - 8 - flick * 0.6);
            ctx.closePath();
            ctx.fill();
        }

        function drawVignette(strength) {
            if (a11yReduceFlash || parentMode) strength *= 0.25;
            if (strength <= 0) return;
            const grad = ctx.createRadialGradient(
                canvas.width / 2, canvas.height / 2, canvas.width * 0.2,
                canvas.width / 2, canvas.height / 2, canvas.width * 0.7
            );
            grad.addColorStop(0, 'rgba(0,0,0,0)');
            grad.addColorStop(1, `rgba(0,0,0,${Math.min(0.85, strength)})`);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawGroundCracks(dreadAmount) {
            if (dreadAmount < 0.15) return;
            ctx.strokeStyle = `rgba(20,10,10,${Math.min(0.6, dreadAmount)})`;
            ctx.lineWidth = 1;
            const count = Math.floor(dreadAmount * 8);
            for (let i = 0; i < count; i++) {
                const seedX = ((i * 137 + Math.floor(bgScroll)) % (canvas.width + 60)) - 30;
                ctx.beginPath();
                ctx.moveTo(seedX, groundY + 4);
                ctx.lineTo(seedX + 6, groundY + 14);
                ctx.lineTo(seedX - 4, groundY + 24);
                ctx.stroke();
            }
        }

        function drawStaticNoise(amount) {
            if (a11yReduceFlash || parentMode) amount *= 0.15;
            if (amount <= 0) return;
            const dots = Math.floor(amount * 90);
            for (let i = 0; i < dots; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const shade = Math.random() > 0.5 ? '255,255,255' : '0,0,0';
                ctx.fillStyle = `rgba(${shade},${Math.random() * 0.5})`;
                ctx.fillRect(x, y, 2, 2);
            }
        }

        function drawDistortion(amount, corrupt) {
            if (a11yReduceFlash || parentMode) amount *= 0.2;
            if (amount <= 0.05) return;
            const bands = Math.floor(amount * 6) + (corrupt ? 3 : 0);
            for (let i = 0; i < bands; i++) {
                if (Math.random() > amount * 0.7) continue;
                const y = Math.random() * canvas.height;
                const h = 1 + Math.random() * (2 + amount * 6);
                const shift = (Math.random() - 0.5) * amount * 18;
                ctx.fillStyle = corrupt
                    ? `rgba(180, 0, 0, ${0.08 + Math.random() * 0.12})`
                    : `rgba(0, 0, 0, ${0.06 + Math.random() * 0.1})`;
                ctx.fillRect(shift, y, canvas.width, h);
            }
            if (amount > 0.35 && Math.random() < amount * 0.25) {
                const y = Math.random() * canvas.height;
                const h = 2 + Math.random() * 8;
                ctx.fillStyle = corrupt
                    ? `rgba(255, 40, 40, ${0.1 + Math.random() * 0.15})`
                    : `rgba(20, 40, 20, ${0.08 + Math.random() * 0.1})`;
                ctx.fillRect((Math.random() - 0.5) * 12, y, canvas.width, h);
            }
            if (amount > 0.5 || corrupt) {

            ctx.font = 'bold 32px monospace';

            const titleY = 76;
            const glitching = menuTitleGlitchTimer > 0;
            const gStrength = glitching ? (menuTitleGlitchTimer / MENU_TITLE_GLITCH_DURATION) : 0; // 1 → 0

            if (glitching && gStrength > 0.05) {
                const intensity = gStrength;
                const gx = (Math.random() - 0.5) * 10 * intensity;
                const gy = (Math.random() - 0.5) * 5 * intensity;
                ctx.save();
                ctx.globalAlpha = 0.7 * intensity;
                ctx.fillStyle = '#ff0040';
                ctx.fillText(titleStr, canvas.width / 2 + gx - 3 * intensity, titleY + gy);

        function drawAchievements() {
            ctx.fillStyle = 'rgba(0,0,0,0.7)';

            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(20, 8, 440, 304);

            ctx.strokeRect(20, 8, 440, 304);

            ctx.textAlign = 'center';
            ctx.fillStyle = '#ffe0b2';

            // Stats bar
            ctx.fillStyle = '#2a2a2a';
            ctx.fillRect(30, 36, 420, 28);

            ctx.font = '11px monospace';
            ctx.textAlign = 'left';
            ctx.fillText(t('deaths') + ': ' + stats.deaths, 40, 54);
            ctx.fillText(t('wins') + ': ' + stats.wins, 160, 54);
            const unlockedCount = Object.keys(unlockedAchievements).length;
            ctx.fillText(t('unlocked') + ': ' + unlockedCount + '/' + ACHIEVEMENTS.length, 260, 54);

            // Scrollable list
            const listTop = 72;
            const rowH = 36;
            const visible = 5;
            const maxScroll = Math.max(0, ACHIEVEMENTS.length - visible);
            if (achScroll > maxScroll) achScroll = maxScroll;
            if (achScroll < 0) achScroll = 0;

            for (let i = 0; i < visible; i++) {
                const idx = achScroll + i;
                if (idx >= ACHIEVEMENTS.length) break;
                const a = ACHIEVEMENTS[idx];
                const y = listTop + i * rowH;
                const unlocked = !!unlockedAchievements[a.id];
                const accent = achievementAccentColor(a.difficulty || 'easy', unlocked);

                ctx.fillStyle = accent.bg;
                ctx.fillRect(30, y, 400, rowH - 4);
                if (unlocked) {
                    ctx.strokeStyle = accent.border;
                    ctx.lineWidth = 1.5;
                    ctx.strokeRect(30, y, 400, rowH - 4);
                }

                ctx.font = '16px monospace';
                ctx.textAlign = 'left';
                ctx.fillStyle = unlocked ? '#fff' : '#555';
                ctx.fillText(unlocked ? a.icon : '🔒', 38, y + 22);

                ctx.font = 'bold 12px monospace';
                ctx.fillStyle = accent.name;
                ctx.fillText(a.name, 62, y + 14);
                ctx.font = '10px monospace';
                ctx.fillStyle = accent.desc;
                ctx.fillText(a.desc, 62, y + 28);

                // Difficulty pip
                if (unlocked) {
                    ctx.font = '8px monospace';
                    ctx.fillStyle = accent.border;
                    ctx.textAlign = 'right';
                    const label = (a.difficulty || 'easy').replace('_', ' ').toUpperCase();
                    ctx.fillText(label, 420, y + 14);
                    ctx.textAlign = 'left';
                }
            }

            // Scroll arrows
            ctx.textAlign = 'center';
            ctx.font = '14px monospace';
            ctx.fillStyle = achScroll > 0 ? '#aaa' : '#444';
            ctx.fillText('▲', 450, listTop + 14);
            ctx.fillStyle = achScroll < maxScroll ? '#aaa' : '#444';
            ctx.fillText('▼', 450, listTop + (visible - 1) * rowH + 20);

            // Back
            ctx.fillStyle = '#37474f';
            ctx.fillRect(achBackBtnArea.x, achBackBtnArea.y, achBackBtnArea.w, achBackBtnArea.h);
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 13px monospace';
            ctx.textAlign = 'center';
            ctx.fillText(t('back'), canvas.width / 2, achBackBtnArea.y + 19);
        }

        function drawTutorial() {
            // Soft play-field background
            ctx.fillStyle = '#87ceeb';
            ctx.fillRect(0, 0, canvas.width, groundY);
            ctx.fillStyle = '#5d9c3f';
            ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
            // Dim overlay
            ctx.fillStyle = 'rgba(0,0,0,0.55)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Panel
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(50, 40, 380, 230);
            ctx.strokeStyle = '#4caf50';
            ctx.lineWidth = 2;
            ctx.strokeRect(50, 40, 380, 230);

            ctx.textAlign = 'center';
            ctx.fillStyle = '#a5d6a7';
            ctx.font = 'bold 16px monospace';
            ctx.fillText(t('tutorial'), canvas.width / 2, 62);

            // Step dots
            for (let i = 0; i < TUTORIAL_STEPS; i++) {
                const dx = canvas.width / 2 - (TUTORIAL_STEPS - 1) * 10 + i * 20;
                ctx.beginPath();
                ctx.arc(dx, 78, 4, 0, Math.PI * 2);
                ctx.fillStyle = i === tutorialStep ? '#4caf50' : '#555';
                ctx.fill();
            }

            const titles = [t('tut1Title'), t('tut2Title'), t('tut3Title'), t('tut4Title')];
            const bodies = [t('tut1Body'), t('tut2Body'), t('tut3Body'), t('tut4Body')];
            const icons = ['⬆️', '🪨', '🏃', '⏸️'];

            ctx.fillStyle = '#fff';
            ctx.font = '28px monospace';
            ctx.fillText(icons[tutorialStep] || '•', canvas.width / 2, 120);

            ctx.fillStyle = '#e8f5e9';
            ctx.font = 'bold 18px monospace';
            ctx.fillText(titles[tutorialStep] || '', canvas.width / 2, 150);

            ctx.fillStyle = '#b0bec5';
            ctx.font = '12px monospace';
            // Word-wrap body
            const body = bodies[tutorialStep] || '';
            const maxW = 340;
            const words = body.split(' ');
            let line = '';
            let ly = 175;
            for (let w = 0; w < words.length; w++) {
                const test = line ? line + ' ' + words[w] : words[w];
                if (ctx.measureText(test).width > maxW) {
                    ctx.fillText(line, canvas.width / 2, ly);
                    line = words[w];
                    ly += 16;
                } else {
                    line = test;
                }
            }
            if (line) ctx.fillText(line, canvas.width / 2, ly);

            // Mini demo leaf on first step
            if (tutorialStep === 0) {
                const bob = Math.sin(Date.now() / 200) * 8;
                drawMatrix(artMatrices.leaf, 222, groundY - 36 + Math.min(0, bob), 2.2, '#2e7d32');
            }
            if (tutorialStep === 1) {
                drawMatrix(artMatrices.leaf, 160, groundY - 36, 2.2, '#2e7d32');
                drawMatrix(artMatrices.spike, 280, groundY - 28, 2.0, '#5d1a1a');
            }

            // Next / Got it button
            const last = tutorialStep >= TUTORIAL_STEPS - 1;
            ctx.fillStyle = last ? '#2e7d32' : '#455a64';
            ctx.fillRect(tutNextBtnArea.x, tutNextBtnArea.y, tutNextBtnArea.w, tutNextBtnArea.h);
            ctx.strokeStyle = last ? '#81c784' : '#78909c';
            ctx.lineWidth = 2;
            ctx.strokeRect(tutNextBtnArea.x, tutNextBtnArea.y, tutNextBtnArea.w, tutNextBtnArea.h);
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 14px monospace';
            ctx.fillText(last ? t('tutStart') : t('tutNext'), canvas.width / 2, tutNextBtnArea.y + 26);

            // Skip
            ctx.fillStyle = '#888';
            ctx.font = '11px monospace';
            ctx.fillText(t('tutSkip'), canvas.width / 2, tutSkipBtnArea.y + 12);
        }

        function fillRainbowText(str, x, y, font) {

            ctx.font = font || ctx.font;
            const metrics = ctx.measureText(str);
            let cx = x - metrics.width / 2;
            const hueBase = (Date.now() * 0.08) % 360;
            for (let i = 0; i < str.length; i++) {
                const ch = str[i];
                const hue = (hueBase + i * 28) % 360;
                ctx.fillStyle = `hsl(${hue}, 95%, 65%)`;
                ctx.fillText(ch, cx, y);
                cx += ctx.measureText(ch).width;
            }
        }
