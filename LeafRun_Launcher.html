    <meta name="theme-color" content="#2e7d32">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(180deg, #87ceeb 0%, #b8e0f0 40%, #5d9c3f 40%, #4a8a32 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1b3d1b;
            overflow-x: hidden;
        }
        .wrap {
            width: min(420px, 94vw);
            background: rgba(255,255,255,0.92);
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.25);
            padding: 28px 24px 22px;
            text-align: center;
            border: 3px solid #2e7d32;
        }
        .logo {
            width: 96px;
            height: 96px;
            image-rendering: pixelated;
            margin: 0 auto 10px;
            display: block;
        }
        h1 {
            font-size: 28px;
            letter-spacing: 1px;
            color: #1b5e20;
            margin-bottom: 4px;
        }
        .sub {
            font-size: 13px;
            color: #558b2f;
            margin-bottom: 22px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px 16px;
            margin: 10px 0;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.12s, box-shadow 0.12s, filter 0.12s;
            text-decoration: none;
            color: #fff;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
        }
        .btn:hover { transform: translateY(-2px); filter: brightness(1.06); }
        .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.2); }
        .btn-pc { background: linear-gradient(180deg, #43a047, #2e7d32); }
        .btn-pe { background: linear-gradient(180deg, #7e57c2, #5e35b1); }
        .btn-ost { background: linear-gradient(180deg, #546e7a, #37474f); font-size: 14px; padding: 11px; }
        .hint {
            margin-top: 16px;
            font-size: 11px;
            color: #666;
            line-height: 1.45;
        }
        .status {
            margin-top: 12px;
            font-size: 12px;
            color: #c62828;
            min-height: 18px;
        }
        .divider {
            height: 1px;
            background: #c8e6c9;
            margin: 16px 0 12px;
        }
        .ver { font-size: 10px; color: #999; margin-top: 8px; }
    </style>
</head>

        <h1>LeafRun</h1>
        <p class="sub">Launcher — pick a version to play</p>

        <button class="btn btn-pc" id="playPC" type="button">▶  Play PC Version</button>
        <button class="btn btn-pe" id="playPE" type="button">▶  Play Pocket Edition</button>

        <div class="divider"></div>
        <button class="btn btn-ost" id="openOst" type="button">♪  Open OST folder tip</button>

        <p class="status" id="status"></p>
        <p class="hint">
            This launcher opens the real game files next to it.<br>
            Keep <b>LeafRun_Launcher.html</b> in the same folder as the games<br>
            (or inside the package next to the <b>game/</b> folder).
        </p>
        <p class="ver">LeafRun Launcher · local HTML</p>
    </div>

    <script>
        const status = document.getElementById('status');

        // Possible relative paths depending on where the launcher is placed
        const PC_CANDIDATES = [
            'game/LeafRun_PC_v1.1.3.html',
            'LeafRun_OST/game/LeafRun_PC_v1.1.3.html',
            'LeafRun_PC_v1.1.3.html',
            'LeafRun_v1.1.3_vibrant.html',
            'game/LeafRun_v1.1.3_vibrant.html'
        ];
        const PE_CANDIDATES = [
            'game/LeafRun_PocketEdition.html',
            'LeafRun_OST/game/LeafRun_PocketEdition.html',
            'LeafRun_PocketEdition.html'
        ];

        async function findExisting(paths) {
            for (const p of paths) {
                try {
                    const res = await fetch(p, { method: 'HEAD', cache: 'no-store' });
                    if (res.ok) return p;
                } catch (e) {}
                // file:// often blocks fetch — still try navigating
            }
            return paths[0]; // fallback: first guess
        }

        function launch(path, label) {
            status.textContent = '';
            status.style.color = '#2e7d32';
            status.textContent = 'Opening ' + label + '…';
            // Open real game in same tab (feels like a launcher handing off)
            window.location.href = path;
        }

        document.getElementById('playPC').addEventListener('click', async () => {
            const path = await findExisting(PC_CANDIDATES);
            launch(path, 'PC Version');
        });

        document.getElementById('playPE').addEventListener('click', async () => {
            const path = await findExisting(PE_CANDIDATES);
            launch(path, 'Pocket Edition');
        });

        document.getElementById('openOst').addEventListener('click', () => {
            status.style.color = '#37474f';
            status.textContent = 'OST is in the ost/ folder (MP3 + WAV with cover art).';
        });
    </script>
</body>
</html>
